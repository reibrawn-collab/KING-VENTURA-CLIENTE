<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>King Ventura Cliente</title>
<style>
  :root {
    --bg: #05080f;
    --surface: #0b1526;
    --surface-2: #132241;
    --border: #1e3560;
    --text: #ffffff;
    --muted: #9fb4d6;
    --gold: #4a90e2;
    --danger: #cf4638;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    line-height: 1.45;
  }

  .container {
    max-width: 900px;
    margin: auto;
  }

  .logo {
    text-align: center;
    margin-bottom: 20px;
  }

  .logo h1 {
    color: var(--gold);
    font-size: 36px;
  }
  .logo p {
    color: var(--muted);
    font-size: 18px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .card h2 {
    font-size: 1.4rem;
    color: var(--gold);
    margin-bottom: 12px;
  }

  label {
    display: block;
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 12px;
  }

  input, select, textarea {
    width: 100%;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 1rem;
  }

  select option {
    background: var(--surface-2);
    color: var(--text);
  }

  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }

  .btn-row {
    margin-top: 14px;
  }

  button {
    background: var(--gold);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: background-color 0.3s ease;
  }

  button:hover {
    background-color: #3671c6;
  }

  #ingredientes {
    margin-top: 8px;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--muted);
    min-height: 40px;
  }

  /* Adicionais estilo checkbox */
  .extras-list {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    max-height: 160px;
    overflow-y: auto;
    margin-top: 8px;
    display: none;
  }

  .extra-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    cursor: pointer;
    color: var(--text);
  }

  .extra-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin: 0;
    flex-shrink: 0;
    cursor: pointer;
  }

  /* Carrinho */
  #carrinho {
    min-height: 80px;
  }

  .item {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }

  .item button {
    background: var(--danger);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.85rem;
    cursor: pointer;
    width: auto;
    float: right;
  }

  .total-box {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--gold);
    margin-top: 12px;
    text-align: right;
  }

  .entrega-info {
    margin-top: 6px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--gold);
    text-align: right;
  }

  #btnToggleAdicionais {
    margin-top: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    color: var(--gold);
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  #btnToggleAdicionais:hover {
    background: var(--gold);
    color: var(--bg);
  }

  .adicional-count {
    background: var(--gold);
    border-radius: 999px;
    padding: 3px 10px;
    color: var(--bg);
    font-weight: 700;
    font-size: 0.9rem;
  }

  @media (max-width: 700px) {
    .logo h1 {
      font-size: 28px;
    }
    body {
      padding: 12px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>👑 KING VENTURA</h1>
      <p>Monte seu pedido online</p>
    </div>

    <div class="card">
      <h2>🍕 Escolha sua Pizza</h2>
      <div class="grid-2">
        <div>
          <label for="tamanho">Tamanho</label>
          <select id="tamanho">
            <option value="brotinho">Brotinho 25cm (1 sabor)</option>
            <option value="grande">Grande 35cm</option>
          </select>
        </div>
        <div>
          <label for="tipoPizza">Tipo</label>
          <select id="tipoPizza">
            <option value="inteira">Inteira</option>
            <option value="meio">Meio a Meio</option>
          </select>
        </div>
      </div>

      <div class="grid-2" style="margin-top: 12px;">
        <div>
          <label for="sabor1">Sabor 1</label>
          <select id="sabor1"></select>
        </div>
        <div id="boxSabor2" style="display:none;">
          <label for="sabor2">Sabor 2 (Meio a Meio)</label>
          <select id="sabor2"></select>
        </div>
      </div>

      <div id="ingredientes"></div>

      <div id="btnToggleAdicionais">
        ➕ Adicionais <span class="adicional-count" id="adicionalCount">0</span>
      </div>
      <div id="listaAdicionais" class="extras-list"></div>

      <label for="obsPizza" style="margin-top: 16px;">Observação da Pizza</label>
      <input id="obsPizza" placeholder="Ex: sem cebola, assar bem" />

      <div class="btn-row">
        <button id="btnAdicionarPizza">Adicionar Pizza ao Carrinho</button>
      </div>
    </div>

    <div class="card">
      <h2>🥤 Bebidas</h2>
      <label for="bebida">Escolha sua bebida</label>
      <select id="bebida">
        <option value="">Nenhuma</option>
        <option value="16">Coca-Cola 2L - R$ 16,00</option>
        <option value="10">Guaraná 1L - R$ 10,00</option>
        <option value="6">Coca-Cola Lata 310ml - R$ 6,00</option>
      </select>
      <div class="btn-row" style="margin-top: 12px;">
        <button id="btnAdicionarBebida">Adicionar Bebida ao Carrinho</button>
      </div>
    </div>

    <div class="card">
      <h2>👤 Dados do Cliente</h2>
      <label for="nome">Nome</label>
      <input id="nome" placeholder="Nome completo" />
      <label for="telefone">Telefone</label>
      <input id="telefone" placeholder="(67) 99999-9999" />
      <label for="cep">CEP</label>
      <input id="cep" maxlength="9" placeholder="Digite seu CEP" />
      <label for="rua">Rua</label>
      <input id="rua" placeholder="Rua" />
      <label for="numero">Número</label>
      <input id="numero" placeholder="Número" />
      <label for="bairro">Bairro</label>
      <input id="bairro" placeholder="Bairro" />
      <label for="observacao">Observação</label>
      <textarea id="observacao" placeholder="Ponto de referência, troco, etc."></textarea>
    </div>

    <div class="card">
      <h2>🛒 Carrinho</h2>
      <div id="carrinho">
        <p style="color: var(--muted);">Nenhum item adicionado.</p>
      </div>
      <div class="entrega-info" id="taxaEntregaArea"></div>
      <div class="total-box" id="totalPedido">R$ 0,00</div>
    </div>

    <div class="btn-row">
      <button id="btnFinalizarPedido">📦 Finalizar Pedido</button>
    </div>
  </div>

<script>
  const SABORES = {
    "Muçarela": {brotinho:15, grande:35, ingredientes:["molho", "muçarela", "azeitonas", "orégano"]},
    "Calabresa": {brotinho:20, grande:35, ingredientes:["molho", "muçarela", "calabresa", "cebola", "azeitonas", "orégano"]},
    "Catupiry": {brotinho:20, grande:35, ingredientes:["molho", "muçarela", "catupiry", "azeitonas", "orégano"]},
    "Calabresa com Catupiry": {brotinho:20, grande:40, ingredientes:["molho", "muçarela", "calabresa", "catupiry","azeitonas", "orégano"]},
    "Frango com Catupiry": {brotinho:20, grande:40, ingredientes:["molho", "muçarela", "frango desfiado", "catupiry", "azeitonas", "orégano"]},
    "Presunto": {brotinho:20, grande:35, ingredientes:["molho", "muçarela", "presunto", "cebola", "azeitonas", "orégano"]},
    "Presunto com Catupiry": {brotinho:20, grande:40, ingredientes:["molho", "muçarela", "presunto", "catupiry", "azeitonas", "orégano"]},
    "Brasileira": {brotinho:20, grande:40, ingredientes:["molho", "muçarela", "milho verde", "ervilha", "cebola", "azeitonas", "orégano"]},
    "Frango com Milho e Tomate": {brotinho:20, grande:40, ingredientes:["molho", "muçarela", "frango desfiado", "milho verde", "tomate", "azeitonas", "orégano"]},
    "Baiana": {brotinho:23, grande:40, ingredientes:["molho", "muçarela", "calabresa", "bacon", "molho de pimenta", "cebola", "azeitonas", "orégano"]},
    "Bacon": {brotinho:23, grande:40, ingredientes:["molho", "muçarela", "bacon", "cebola", "azeitonas", "orégano"]},
    "Cremosa": {brotinho:23, grande:40, ingredientes:["molho", "muçarela", "catupiry", "creme de leite", "azeitonas", "orégano"]},
    "Lombo ao Creme": {brotinho:23, grande:40, ingredientes:["molho", "muçarela", "lombinho", "creme de leite", "azeitonas", "orégano"]}
  };

  const ADICIONAIS = [
    {nome:"Catupiry Extra", valor:4},
    {nome:"Presunto Extra", valor:4},
    {nome:"Cebola Extra", valor:4},
    {nome:"Milho Extra", valor:4},
    {nome:"Ervilha Extra", valor:4},
    {nome:"Muçarela Extra", valor:5},
    {nome:"Bacon Extra", valor:5}
  ];

  let carrinho = [];

  const adicionaisCountEl = document.getElementById('adicionalCount');
  const btnToggleAdicionais = document.getElementById('btnToggleAdicionais');
  const listaAdicionaisEl = document.getElementById('listaAdicionais');

  function textoLimpo(texto) {
    return texto.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  }

  function formarListaIngredientes(ingredientes){
    if(ingredientes.length <=1) return ingredientes.join("");
    return ingredientes.slice(0, ingredientes.length-1).join(", ") + " e " + ingredientes[ingredientes.length-1];
  }

  // Preenche selects de sabores
  function carregarSabores() {
    const tamanho = document.getElementById("tamanho").value;
    const sabor1 = document.getElementById("sabor1");
    const sabor2 = document.getElementById("sabor2");
    const prev1 = sabor1.value;
    const prev2 = sabor2.value;

    sabor1.innerHTML = '<option value="">Selecione um sabor</option>';
    sabor2.innerHTML = '<option value="">Selecione um sabor</option>';

    Object.entries(SABORES).forEach(([nome, dados]) => {
      const preco = (tamanho === "brotinho") ? dados.brotinho : dados.grande;
      const texto = `${nome} - R$ ${preco.toFixed(2)}`;
      sabor1.innerHTML += `<option value="${nome}">${texto}</option>`;
      sabor2.innerHTML += `<option value="${nome}">${texto}</option>`;
    });

    sabor1.value = (prev1 && SABORES[prev1]) ? prev1 : "";
    sabor2.value = (prev2 && SABORES[prev2]) ? prev2 : "";

    // Tipo pizza e sabor2 visibilidade
    const tipoPizza = document.getElementById("tipoPizza");
    const boxSabor2 = document.getElementById("boxSabor2");
    if (tamanho === "brotinho") {
      tipoPizza.value = "inteira";
      tipoPizza.disabled = true;
      boxSabor2.style.display = "none";
    } else {
      tipoPizza.disabled = false;
      boxSabor2.style.display = (tipoPizza.value === "meio") ? "block" : "none";
    }

    atualizarPreviewIngredientes();
  }

  // Atualiza área de ingredientes conforme sabores escolhidos
  function atualizarPreviewIngredientes() {
    const el = document.getElementById("ingredientes");
    const tamanho = document.getElementById("tamanho").value;
    const tipo = document.getElementById("tipoPizza").value;
    const s1 = document.getElementById("sabor1").value;
    const s2 = document.getElementById("sabor2").value;

    if (!s1 || !SABORES[s1]) {
      el.innerText = "";
      return;
    }

    if (tamanho === "grande" && tipo === "meio" && s2 && SABORES[s2]) {
      el.innerText = `Ingredientes — 50% ${s1}: ${formarListaIngredientes(SABORES[s1].ingredientes)} | 50% ${s2}: ${formarListaIngredientes(SABORES[s2].ingredientes)}`;
    } else {
      el.innerText = `Ingredientes: ${formarListaIngredientes(SABORES[s1].ingredientes)}`;
    }
  }

  // Monta lista adicionais checkboxes
  function montarListaAdicionais() {
    listaAdicionaisEl.innerHTML = "";
    ADICIONAIS.forEach(({nome, valor}) => {
      const label = document.createElement("label");
      label.classList.add("extra-item");
      label.innerHTML = `<input type="checkbox" value="${valor}" data-nome="${nome}"> ${nome} (+R$ ${valor.toFixed(2)})`;
      listaAdicionaisEl.appendChild(label);
    });
  }

  // Atualiza contagem no botão de adicionais
  function atualizarTextoAdicionais() {
    const marcados = listaAdicionaisEl.querySelectorAll("input:checked");
    adicionaisCountEl.innerText = marcados.length;
    if(marcados.length === 0) {
      btnToggleAdicionais.innerText = "➕ Adicionais ";
      btnToggleAdicionais.appendChild(adicionaisCountEl);
    } else {
      btnToggleAdicionais.innerText = `➕ Adicionais (${marcados.length}) `;
      btnToggleAdicionais.appendChild(adicionaisCountEl);
    }
  }

  // Atualiza área carrinho e total
  function atualizarCarrinho() {
    const container = document.getElementById("carrinho");
    const totalEl = document.getElementById("totalPedido");
    const taxaEl = document.getElementById("taxaEntregaArea");

    if (carrinho.length === 0) {
      container.innerHTML = '<p style="color: var(--muted);">Nenhum item adicionado.</p>';
      totalEl.innerText = "R$ 0,00";
      taxaEl.innerText = "";
      return;
    }

    container.innerHTML = carrinho.map((item, i) => `
      <div class="item">
        <b>${item.descricao}</b>
        ${item.ingredientes ? `<div style="font-style: italic; color: var(--muted); font-size: 0.9rem;">${item.ingredientes}</div>` : ""}
        ${item.observacao ? `<div style="color: var(--gold); font-size: 0.9rem;">Obs: ${item.observacao}</div>` : ""}
        <button type="button" onclick="removerItem(${i})">Excluir</button>
        <div style="clear: both;"></div>
      </div>
    `).join("");

    const subtotal = carrinho.reduce((a,v) => a + v.valor, 0);
    // Para fins deste exemplo, arredondar entrega grátis sempre para 0
    let taxaEntrega = 0; // Aqui poderia ser calculado pelo CEP / bairro Se quiser posso ajudar a incluir cálculo real

    const total = subtotal + taxaEntrega;
    taxaEl.innerText = taxaEntrega === 0 ? "🎉 Você ganhou entrega grátis!" : `Taxa de entrega: R$ ${taxaEntrega.toFixed(2)}`;
    totalEl.innerText = `R$ ${total.toFixed(2)}`;
  }

  // Remove item do carrinho
  function removerItem(idx) {
    if(idx >= 0 && idx < carrinho.length) {
      carrinho.splice(idx, 1);
      atualizarCarrinho();
    }
  }

  /* EVENTOS */

  document.getElementById("tamanho").addEventListener("change", () => {
    carregarSabores();
  });

  document.getElementById("tipoPizza").addEventListener("change", () => {
    const tipoPizza = document.getElementById("tipoPizza");
    const boxSabor2 = document.getElementById("boxSabor2");

    boxSabor2.style.display = tipoPizza.value === "meio" ? "block" : "none";
    atualizarPreviewIngredientes();
  });

  document.getElementById("sabor1").addEventListener("change", atualizarPreviewIngredientes);
  document.getElementById("sabor2").addEventListener("change", atualizarPreviewIngredientes);

  btnToggleAdicionais.addEventListener("click", () => {
    if(listaAdicionaisEl.style.display === "none" || listaAdicionaisEl.style.display === "") {
      listaAdicionaisEl.style.display = "block";
      btnToggleAdicionais.innerText = "➖ Ocultar Adicionais ";
      btnToggleAdicionais.appendChild(adicionaisCountEl);
    } else {
      listaAdicionaisEl.style.display = "none";
      atualizarTextoAdicionais();
    }
  });

  listaAdicionaisEl.addEventListener("change", atualizarTextoAdicionais);

  document.getElementById("btnAdicionarPizza").addEventListener("click", () => {
    const tamanho = document.getElementById("tamanho").value;
    const tipo = document.getElementById("tipoPizza").value;
    const s1 = document.getElementById("sabor1").value;
    const s2 = document.getElementById("sabor2").value;

    if (!s1 || !SABORES[s1]) {
      alert("Selecione o sabor 1.");
      return;
    }

    if (tamanho === "brotinho" && tipo !== "inteira") {
      alert("Brotinho só aceita pizza inteira.");
      return;
    }

    if (tipo === "meio" && (!s2 || !SABORES[s2])) {
      alert("Selecione o sabor 2 para pizza Meio a Meio.");
      return;
    }

    let descricao = "";
    let valor = 0;
    let ingredientes = "";

    if (tamanho === "brotinho") {
      descricao = `Brotinho 25cm - ${s1}`;
      valor = SABORES[s1].brotinho;
      ingredientes = SABORES[s1].ingredientes.join(", ");
    } else if (tipo === "meio") {
      descricao = `Grande 35cm Meio a Meio - ${s1} / ${s2}`;
      valor = Math.max(SABORES[s1].grande, SABORES[s2].grande);
      ingredientes = `50% ${s1}: ${SABORES[s1].ingredientes.join(", ")} | 50% ${s2}: ${SABORES[s2].ingredientes.join(", ")}`;
    } else {
      descricao = `Grande 35cm - ${s1}`;
      valor = SABORES[s1].grande;
      ingredientes = SABORES[s1].ingredientes.join(", ");
    }

    // Adicionais selecionados
    const adicionaisSelecionados = [];
    let valorAdicional = 0;
    listaAdicionaisEl.querySelectorAll("input[type=checkbox]:checked").forEach((input) => {
      adicionaisSelecionados.push(input.dataset.nome);
      valorAdicional += Number(input.value);
    });

    if (adicionaisSelecionados.length) {
      descricao += " + " + adicionaisSelecionados.join(", ");
      valor += valorAdicional;
    }

    const obs = document.getElementById("obsPizza").value.trim();

    carrinho.push({
      descricao,
      ingredientes,
      observacao: obs,
      valor
    });

    atualizarCarrinho();

    // limpa seleção adicionais e observação
    listaAdicionaisEl.querySelectorAll("input[type=checkbox]").forEach(i => i.checked = false);
    atualizarTextoAdicionais();
    document.getElementById("obsPizza").value = "";

    alert("Pizza adicionada ao carrinho!");
  });

  document.getElementById("btnAdicionarBebida").addEventListener("click", () => {
    const bebidaSel = document.getElementById("bebida");
    const val = bebidaSel.value;
    if (!val) {
      alert("Selecione uma bebida.");
      return;
    }
    const descricao = bebidaSel.options[bebidaSel.selectedIndex].text.split(" - ")[0];
    const valor = Number(val);
    carrinho.push({
      descricao,
      ingredientes: "",
      observacao: "",
      valor
    });
    atualizarCarrinho();
    bebidaSel.value = "";
    alert("Bebida adicionada ao carrinho!");
  });

  document.getElementById("btnFinalizarPedido").addEventListener("click", () => {
    if (carrinho.length === 0) {
      alert("Adicione ao menos um item ao carrinho antes de finalizar.");
      return;
    }
    const nome = document.getElementById("nome").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const cep = document.getElementById("cep").value.trim();
    const rua = document.getElementById("rua").value.trim();
    const numero = document.getElementById("numero").value.trim();
    const bairro = document.getElementById("bairro").value.trim();

    if (!nome || !telefone || !cep || !rua || !numero || !bairro) {
      alert("Preencha todos os dados do cliente corretamente.");
      return;
    }

    // Aqui você pode implementar o envio do pedido para seu backend ou WhatsApp API.

    alert("Pedido enviado! Obrigado pela preferência.");
    // Limpa tudo para novo pedido
    carrinho = [];
    atualizarCarrinho();
    document.getElementById("nome").value = "";
    document.getElementById("telefone").value = "";
    document.getElementById("cep").value = "";
    document.getElementById("rua").value = "";
    document.getElementById("numero").value = "";
    document.getElementById("bairro").value = "";
    document.getElementById("observacao").value = "";
  });

  document.getElementById("tamanho").addEventListener("change", carregarSabores);
  document.getElementById("tipoPizza").addEventListener("change", () => {
    const tipoPizza = document.getElementById("tipoPizza");
    const boxSabor2 = document.getElementById("boxSabor2");
    if (document.getElementById("tamanho").value === "brotinho") {
      tipoPizza.value = "inteira";
      tipoPizza.disabled = true;
      boxSabor2.style.display = "none";
    } else {
      tipoPizza.disabled = false;
      boxSabor2.style.display = tipoPizza.value === "meio" ? "block" : "none";
    }
    atualizarPreviewIngredientes();
  });

  // Inicialização
  montarListaAdicionais();
  carregarSabores();
  atualizarTextoAdicionais();

</script>
</body>
</html>
