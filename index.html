<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>King Ventura Cliente</title>
<style>
  /* Mesmos estilos do exemplo anterior, omitidos aqui por brevidade */
  :root {
    --bg: #05080f;
    --surface: #0b1526;
    --surface-2: #132241;
    --border: #1e3560;
    --text: #ffffff;
    --muted: #9fb4d6;
    --gold: #4a90e2;
    --danger: #cf4638;
  }
  /* ... todo o CSS igual ao anterior para manter estilo ... */
  /* Recomendo manter o CSS do exemplo anterior para simplicidade */
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <h1>👑 KING VENTURA</h1>
    <p>Monte seu pedido online</p>
  </div>

  <div class="card">
    <h2>🍕 Escolha sua Pizza</h2>
    <div class="grid-2">
      <div>
        <label for="tamanho">Tamanho</label>
        <select id="tamanho">
          <option value="brotinho">Brotinho 25cm (1 sabor)</option>
          <option value="grande">Grande 35cm</option>
        </select>
      </div>
      <div>
        <label for="tipoPizza">Tipo</label>
        <select id="tipoPizza">
          <option value="inteira">Inteira</option>
          <option value="meio">Meio a Meio</option>
        </select>
      </div>
    </div>

    <div class="grid-2" style="margin-top: 12px;">
      <div>
        <label for="sabor1">Sabor 1</label>
        <select id="sabor1"></select>
      </div>
      <div id="boxSabor2" style="display:none;">
        <label for="sabor2">Sabor 2 (Meio a Meio)</label>
        <select id="sabor2"></select>
      </div>
    </div>

    <div id="ingredientes" style="margin-top:6px; font-style: italic; color: var(--muted); min-height: 40px;"></div>

    <div id="btnToggleAdicionais" style="margin-top: 10px; cursor:pointer; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--gold); font-weight: 700; display: inline-flex; align-items: center; justify-content: space-between; width: 100%;">
      ➕ Adicionais <span id="adicionalCount" style="background: var(--gold); border-radius: 999px; padding: 3px 10px; color: var(--bg); font-weight: 700; font-size: 0.9rem;">0</span>
    </div>
    <div id="listaAdicionais" class="extras-list" style="display:none; max-height:160px; overflow-y:auto; background: var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-top:8px;"></div>

    <label for="obsPizza" style="margin-top: 16px;">Observação da Pizza</label>
    <input id="obsPizza" placeholder="Ex: sem cebola, assar bem" />

    <div class="btn-row" style="margin-top: 14px;">
      <button id="btnAdicionarPizza">Adicionar Pizza ao Carrinho</button>
    </div>
  </div>

  <div class="card">
    <h2>🥤 Bebidas</h2>
    <label for="bebida">Escolha sua bebida</label>
    <select id="bebida">
      <option value="">Nenhuma</option>
      <option value="16">Coca-Cola 2L - R$ 16,00</option>
      <option value="10">Guaraná 1L - R$ 10,00</option>
      <option value="6">Coca-Cola Lata 310ml - R$ 6,00</option>
    </select>
    <div class="btn-row" style="margin-top: 12px;">
      <button id="btnAdicionarBebida">Adicionar Bebida ao Carrinho</button>
    </div>
  </div>

  <div class="card">
    <h2>👤 Dados do Cliente</h2>
    <label for="nome">Nome</label>
    <input id="nome" placeholder="Nome completo" />
    <label for="telefone">Telefone</label>
    <input id="telefone" placeholder="(67) 99999-9999" />
    <label for="cep">CEP</label>
    <input id="cep" maxlength="9" placeholder="Digite seu CEP" />
    <label for="rua">Rua</label>
    <input id="rua" placeholder="Rua" />
    <label for="numero">Número</label>
    <input id="numero" placeholder="Número" />
    <label for="bairro">Bairro</label>
    <input id="bairro" placeholder="Bairro" />
    <label for="observacao">Observação</label>
    <textarea id="observacao" placeholder="Ponto de referência, troco, etc."></textarea>
  </div>

  <div class="card">
    <h2>🛒 Carrinho</h2>
    <div id="carrinho" style="min-height: 80px; color: var(--muted); font-style: italic;">Nenhum item adicionado.</div>
    <div id="taxaEntregaArea" style="margin-top: 4px; color: var(--gold); font-weight: 700; text-align:right;"></div>
    <div id="totalPedido" style="margin-top: 8px; font-weight: 700; font-size: 1.3rem; color: var(--gold); text-align: right;">R$ 0,00</div>
  </div>

  <div class="btn-row" style="margin-top:12px;">
    <button id="btnFinalizarPedido">📦 Finalizar Pedido</button>
  </div>
</div>

<script>
  const numeroWhats = "5567991476156"; // Seu número para WhatsApp (com código do Brasil)

  const SABORES = {
    "Muçarela": {brotinho:15, grande:35, ingredientes:["molho", "muçarela", "azeitonas", "orégano"]},
    "Calabresa": {brotinho:20, grande:35, ingredientes:["molho", "muçarela", "calabresa", "cebola", "azeitonas", "orégano"]},
    "Catupiry": {brotinho:20, grande:35, ingredientes:["molho", "muçarela", "catupiry", "azeitonas", "orégano"]},
    "Calabresa com Catupiry": {brotinho:20, grande:40, ingredientes:["molho", "muçarela", "calabresa", "catupiry","azeitonas", "orégano"]},
    "Frango com Catupiry": {brotinho:20, grande:40, ingredientes:["molho", "muçarela", "frango desfiado", "catupiry", "azeitonas", "orégano"]},
    "Presunto": {brotinho:20, grande:35, ingredientes:["molho", "muçarela", "presunto", "cebola", "azeitonas", "orégano"]},
    "Presunto com Catupiry": {brotinho:20, grande:40, ingredientes:["molho", "muçarela", "presunto", "catupiry", "azeitonas", "orégano"]},
    "Brasileira": {brotinho:20, grande:40, ingredientes:["molho", "muçarela", "milho verde", "ervilha", "cebola", "azeitonas", "orégano"]},
    "Frango com Milho e Tomate": {brotinho:20, grande:40, ingredientes:["molho", "muçarela", "frango desfiado", "milho verde", "tomate", "azeitonas", "orégano"]},
    "Baiana": {brotinho:23, grande:40, ingredientes:["molho", "muçarela", "calabresa", "bacon", "molho de pimenta", "cebola", "azeitonas", "orégano"]},
    "Bacon": {brotinho:23, grande:40, ingredientes:["molho", "muçarela", "bacon", "cebola", "azeitonas", "orégano"]},
    "Cremosa": {brotinho:23, grande:40, ingredientes:["molho", "muçarela", "catupiry", "creme de leite", "azeitonas", "orégano"]},
    "Lombo ao Creme": {brotinho:23, grande:40, ingredientes:["molho", "muçarela", "lombinho", "creme de leite", "azeitonas", "orégano"]}
  };

  const ADICIONAIS = [
    {nome:"Catupiry Extra", valor:4},
    {nome:"Presunto Extra", valor:4},
    {nome:"Cebola Extra", valor:4},
    {nome:"Milho Extra", valor:4},
    {nome:"Ervilha Extra", valor:4},
    {nome:"Muçarela Extra", valor:5},
    {nome:"Bacon Extra", valor:5}
  ];

  let carrinho = [];

  // Elementos importantes
  const sabor1El = document.getElementById("sabor1");
  const sabor2El = document.getElementById("sabor2");
  const adicionalCountEl = document.getElementById("adicionalCount");
  const btnToggleAdicionaisEl = document.getElementById("btnToggleAdicionais");
  const listaAdicionaisEl = document.getElementById("listaAdicionais");
  const ingredientesEl = document.getElementById("ingredientes");
  const carrinhoEl = document.getElementById("carrinho");
  const totalPedidoEl = document.getElementById("totalPedido");
  const taxaEntregaEl = document.getElementById("taxaEntregaArea");

  // Função formatação ingredientes em texto legível
  function formarListaIngredientes(ingredientes){
    if(ingredientes.length <=1) return ingredientes.join("");
    return ingredientes.slice(0, ingredientes.length-1).join(", ") + " e " + ingredientes[ingredientes.length-1];
  }

  // Carrega sabores no select, com ingredientes e preço no texto
  function carregarSabores() {
    const tamanho = document.getElementById("tamanho").value;

    function textoSabor(nome, dados) {
      const preco = (tamanho === "brotinho") ? dados.brotinho : dados.grande;
      const ings = formarListaIngredientes(dados.ingredientes);
      return `${nome} - R$ ${preco.toFixed(2)} (${ings})`;
    }

    const prev1 = sabor1El.value;
    const prev2 = sabor2El.value;

    sabor1El.innerHTML = '<option value="">Selecione um sabor</option>';
    sabor2El.innerHTML = '<option value="">Selecione um sabor</option>';

    Object.entries(SABORES).forEach(([nome, dados]) => {
      const opt1 = document.createElement("option");
      opt1.value = nome;
      opt1.textContent = textoSabor(nome, dados);
      sabor1El.appendChild(opt1);

      const opt2 = opt1.cloneNode(true);
      sabor2El.appendChild(opt2);
    });

    sabor1El.value = (prev1 && SABORES[prev1]) ? prev1 : "";
    sabor2El.value = (prev2 && SABORES[prev2]) ? prev2 : "";

    // Ajusta tipo pizza e caixa sabor 2
    const tipoPizzaEl = document.getElementById("tipoPizza");
    const boxSabor2 = document.getElementById("boxSabor2");

    if (tamanho === "brotinho") {
      tipoPizzaEl.value = "inteira";
      tipoPizzaEl.disabled = true;
      boxSabor2.style.display = "none";
    } else {
      tipoPizzaEl.disabled = false;
      boxSabor2.style.display = (tipoPizzaEl.value === "meio") ? "block" : "none";
    }
    atualizarPreviewIngredientes();
  }

  // Atualiza área ingredientes com base no sabor escolhido
  function atualizarPreviewIngredientes() {
    const tamanho = document.getElementById("tamanho").value;
    const tipo = document.getElementById("tipoPizza").value;
    const s1 = sabor1El.value;
    const s2 = sabor2El.value;

    if(!s1 || !SABORES[s1]){
      ingredientesEl.innerText = "";
      return;
    }

    if(tamanho === "grande" && tipo === "meio" && s2 && SABORES[s2]){
      ingredientesEl.innerText = `Ingredientes — 50% ${s1}: ${formarListaIngredientes(SABORES[s1].ingredientes)} | 50% ${s2}: ${formarListaIngredientes(SABORES[s2].ingredientes)}`;
    } else {
      ingredientesEl.innerText = `Ingredientes: ${formarListaIngredientes(SABORES[s1].ingredientes)}`;
    }
  }

  // Monta lista adicionais com checkboxes
  function montarListaAdicionais() {
    listaAdicionaisEl.innerHTML = "";
    ADICIONAIS.forEach(({nome, valor})=>{
      const label = document.createElement("label");
      label.classList.add("extra-item");
      label.innerHTML = `<input type="checkbox" value="${valor}" data-nome="${nome}"> ${nome} (+R$ ${valor.toFixed(2)})`;
      listaAdicionaisEl.appendChild(label);
    });
  }

  // Atualiza texto e contagem no botão adicionais
  function atualizarTextoAdicionais() {
    const marcados = listaAdicionaisEl.querySelectorAll("input[type=checkbox]:checked");
    const qtd = marcados.length;
    adicionalCountEl.innerText = qtd;
    if (qtd === 0) {
      btnToggleAdicionaisEl.innerText = "➕ Adicionais ";
      btnToggleAdicionaisEl.appendChild(adicionalCountEl);
    } else {
      btnToggleAdicionaisEl.innerText = `➕ Adicionais (${qtd}) `;
      btnToggleAdicionaisEl.appendChild(adicionalCountEl);
    }
  }

  // Atualiza o conteúdo do carrinho e total
  function atualizarCarrinho() {
    if (carrinho.length === 0) {
      carrinhoEl.innerHTML = '<p style="color: var(--muted); font-style: italic;">Nenhum item adicionado.</p>';
      totalPedidoEl.innerText = "R$ 0,00";
      taxaEntregaEl.innerText = "";
      return;
    }
    carrinhoEl.innerHTML = carrinho.map((item,i) => {
      return `<div class="item">
        <b>${item.descricao}</b>
        ${item.ingredientes ? `<div style="font-style: italic; color: var(--muted); font-size: 0.9rem;">${item.ingredientes}</div>` : ""}
        ${item.observacao ? `<div style="color: var(--gold); font-size: 0.9rem;">Obs: ${item.observacao}</div>` : ""}
        <button type="button" onclick="removerItem(${i})">Excluir</button>
      </div>`;
    }).join("");

    // Para simplificar, taxa de entrega fixada a 0 aqui
    const subtotal = carrinho.reduce((acc,v) => acc + v.valor, 0);
    const taxaEntrega = 0;

    taxaEntregaEl.innerText = taxaEntrega === 0 ? "🎉 Você ganhou entrega grátis!" : `Taxa de entrega: R$ ${taxaEntrega.toFixed(2)}`;
    totalPedidoEl.innerText = `R$ ${(subtotal+taxaEntrega).toFixed(2)}`;
  }

  // Remove item do carrinho
  function removerItem(idx) {
    if(idx >= 0 && idx < carrinho.length){
      carrinho.splice(idx,1);
      atualizarCarrinho();
    }
  }

  // Busca endereço pelo CEP via ViaCEP e preenche rua e bairro
  async function buscarEnderecoPorCEP() {
    const cepInput = document.getElementById("cep");
    let cep = cepInput.value.replace(/\D/g, "");
    if(cep.length !== 8) return;

    try {
      const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
      const data = await res.json();
      if(!data.erro){
        document.getElementById("rua").value = data.logradouro || "";
        document.getElementById("bairro").value = data.bairro || "";
      }
    } catch (e) {
      console.log("Erro ao buscar CEP", e);
    }
  }

  // Busca CEP pelo endereço (rua + bairro) em Campo Grande/MS via ViaCEP e preenche
  async function buscarCEPPorEndereco() {
    const ruaInput = document.getElementById("rua");
    const bairroInput = document.getElementById("bairro");
    const rua = ruaInput.value.trim();
    const bairro = bairroInput.value.trim();

    if(rua.length < 3) return;

    try {
      const res = await fetch(`https://viacep.com.br/ws/MS/Campo%20Grande/${encodeURIComponent(rua)}/json/`);
      const lista = await res.json();
      if(Array.isArray(lista) && lista.length > 0){
        let entrada = lista[0];
        if(bairro){
          const filtro = lista.find(item => item.bairro && item.bairro.toLowerCase() === bairro.toLowerCase());
          if(filtro) entrada = filtro;
        }
        document.getElementById("cep").value = entrada.cep || "";
      }
    } catch(e){
      console.log("Erro buscar CEP pela rua", e);
    }
  }

  // Monta texto completo do pedido para enviar no WhatsApp
  function montarTextoPedidoWhats() {
    const nome = document.getElementById("nome").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const cep = document.getElementById("cep").value.trim();
    const rua = document.getElementById("rua").value.trim();
    const numero = document.getElementById("numero").value.trim();
    const bairro = document.getElementById("bairro").value.trim();
    const obsCliente = document.getElementById("observacao").value.trim();

    let texto = `KING VENTURA PIZZARIA\n\n`;

    texto += `Cliente: ${nome}\n`;
    texto += `Telefone: ${telefone}\n`;
    texto += `CEP: ${cep}\n`;
    texto += `Endereço: ${rua}\n`;
    texto += `Número: ${numero}\n`;
    texto += `Bairro: ${bairro}\n`;
    texto += `Observação: ${obsCliente}\n\n`;

    texto += `ITENS DO PEDIDO\n`;

    carrinho.forEach(item => {
      texto += `${item.descricao} - R$ ${item.valor.toFixed(2)}\n`;
      if(item.ingredientes){
        texto += `Ingredientes: ${item.ingredientes}\n`;
      }
      if(item.observacao){
        texto += `Obs: ${item.observacao}\n`;
      }
      texto += "\n";
    });

    texto += `TOTAL: ${totalPedidoEl.innerText}\n`;

    return texto;
  }

  // Eventos

  // Cep input perde foco: busca endereço
  document.getElementById("cep").addEventListener("blur", buscarEnderecoPorCEP);

  // Rua ou bairro mudam: busca CEP
  document.getElementById("rua").addEventListener("blur", buscarCEPPorEndereco);
  document.getElementById("bairro").addEventListener("blur", buscarCEPPorEndereco);

  // Atualiza ingredientes quando sabor muda
  sabor1El.addEventListener("change", atualizarPreviewIngredientes);
  sabor2El.addEventListener("change", atualizarPreviewIngredientes);

  // Botão para mostrar/esconder adicionais
  btnToggleAdicionaisEl.addEventListener("click", () => {
    if(listaAdicionaisEl.style.display === "none" || listaAdicionaisEl.style.display === ""){
      listaAdicionaisEl.style.display = "block";
      btnToggleAdicionaisEl.innerText = "➖ Ocultar Adicionais ";
      btnToggleAdicionaisEl.appendChild(adicionalCountEl);
    } else {
      listaAdicionaisEl.style.display = "none";
      atualizarTextoAdicionais();
    }
  });

  listaAdicionaisEl.addEventListener("change", atualizarTextoAdicionais);

  // Botão adicionar pizza
  document.getElementById("btnAdicionarPizza").addEventListener("click", () => {
    const tamanho = document.getElementById("tamanho").value;
    const tipo = document.getElementById("tipoPizza").value;
    const s1 = sabor1El.value;
    const s2 = sabor2El.value;

    if (!s1 || !SABORES[s1]) {
      alert("Selecione o sabor 1.");
      return;
    }

    if (tamanho === "brotinho" && tipo !== "inteira") {
      alert("Brotinho só aceita pizza inteira.");
      return;
    }

    if (tipo === "meio" && (!s2 || !SABORES[s2])) {
      alert("Selecione o sabor 2 para pizza Meio a Meio.");
      return;
    }

    let descricao = "";
    let valor = 0;
    let ingredientes = "";

    if (tamanho === "brotinho") {
      descricao = `Brotinho 25cm - ${s1}`;
      valor = SABORES[s1].brotinho;
      ingredientes = SABORES[s1].ingredientes.join(", ");
    } else if (tipo === "meio") {
      descricao = `Grande 35cm Meio a Meio - ${s1} / ${s2}`;
      valor = Math.max(SABORES[s1].grande, SABORES[s2].grande);
      ingredientes = `50% ${s1}: ${SABORES[s1].ingredientes.join(", ")} | 50% ${s2}: ${SABORES[s2].ingredientes.join(", ")}`;
    } else {
      descricao = `Grande 35cm - ${s1}`;
      valor = SABORES[s1].grande;
      ingredientes = SABORES[s1].ingredientes.join(", ");
    }

    // Adicionais selecionados
    const adicionaisSelecionados = [];
    let valorAdicional = 0;
    listaAdicionaisEl.querySelectorAll("input[type=checkbox]:checked").forEach(input => {
      adicionaisSelecionados.push(input.dataset.nome);
      valorAdicional += Number(input.value);
    });

    if (adicionaisSelecionados.length) {
      descricao += " + " + adicionaisSelecionados.join(", ");
      valor += valorAdicional;
    }

    const obs = document.getElementById("obsPizza").value.trim();

    carrinho.push({descricao, ingredientes, observacao: obs, valor});
    atualizarCarrinho();

    listaAdicionaisEl.querySelectorAll("input[type=checkbox]").forEach(i => i.checked = false);
    atualizarTextoAdicionais();
    document.getElementById("obsPizza").value = "";

    alert("Pizza adicionada ao carrinho!");
  });

  // Botão adicionar bebida
  document.getElementById("btnAdicionarBebida").addEventListener("click", () => {
    const bebidaSel = document.getElementById("bebida");
    const val = bebidaSel.value;
    if (!val) {
      alert("Selecione uma bebida.");
      return;
    }
    const descricao = bebidaSel.options[bebidaSel.selectedIndex].text.split(" - ")[0];
    const valor = Number(val);
    carrinho.push({descricao, ingredientes: "", observacao: "", valor});
    atualizarCarrinho();
    bebidaSel.value = "";
    alert("Bebida adicionada ao carrinho!");
  });

  // Botão finalizar pedido - envia via WhatsApp
  document.getElementById("btnFinalizarPedido").addEventListener("click", () => {
    if(carrinho.length === 0){
      alert("Adicione pelo menos um item ao carrinho antes de finalizar.");
      return;
    }
    const nome = document.getElementById("nome").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const cep = document.getElementById("cep").value.trim();
    const rua = document.getElementById("rua").value.trim();
    const numero = document.getElementById("numero").value.trim();
    const bairro = document.getElementById("bairro").value.trim();

    if (!nome || !telefone || !cep || !rua || !numero || !bairro) {
      alert("Preencha todos os dados do cliente corretamente.");
      return;
    }

    const textoPedido = montarTextoPedidoWhats();
    const urlWhats = `https://wa.me/${numeroWhats}?text=` + encodeURIComponent(textoPedido);

    window.open(urlWhats, "_blank");
  });

  // Eventos adicionais para mudar visibilidade do combo sabor2
  document.getElementById("tamanho").addEventListener("change", carregarSabores);
  document.getElementById("tipoPizza").addEventListener("change", () => {
    const tipoPizzaEl = document.getElementById("tipoPizza");
    const boxSabor2 = document.getElementById("boxSabor2");
    if(document.getElementById("tamanho").value === "brotinho"){
      tipoPizzaEl.value = "inteira";
      tipoPizzaEl.disabled = true;
      boxSabor2.style.display = "none";
    } else {
      tipoPizzaEl.disabled = false;
      boxSabor2.style.display = (tipoPizzaEl.value === "meio") ? "block" : "none";
    }
    atualizarPreviewIngredientes();
  });

  // Inicializa a tela com os dados
  montarListaAdicionais();
  carregarSabores();
  atualizarTextoAdicionais();

</script>
</body>
</html>
