<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>King Ventura Cliente</title>
<style>
:root{
  --bg:#05080f;
  --card:#0b1526;
  --card2:#132241;
  --border:#1e3560;
  --azul:#4a90e2;
  --texto:#ffffff;
  --muted:#9fb4d6;
}
*{
  margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif;
}
body{
  background:var(--bg);
  color:var(--texto);
  padding:15px;
}
.container{
  max-width:900px;
  margin:auto;
}
.logo{
  text-align:center;
  margin-bottom:20px;
}
.logo h1{
  color:var(--azul);
  font-size:36px;
}
.logo p{
  color:var(--muted);
  font-size:18px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
}
.card h2{
  color:var(--azul);
  margin-bottom:15px;
}
input,
select,
textarea{
  width:100%;
  background:var(--card2);
  color:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  margin-top:8px;
}
label{
  display:block;
  margin-top:10px;
  color:var(--muted);
  cursor:pointer;
}
.grid{
  display:grid;
  gap:12px;
}
.grid-2{
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
}
button{
  cursor:pointer;
  border:none;
}
.btn{
  background:var(--azul);
  color:white;
  padding:12px;
  border-radius:10px;
  width:100%;
  font-weight:bold;
}
.btn:hover{
  opacity:.9;
}
.sabores-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}
.sabor-card{
  background:var(--card2);
  border:2px solid transparent;
  border-radius:12px;
  padding:15px;
  cursor:pointer;
  transition:.2s;
}
.sabor-card:hover{
  border-color:var(--azul);
}
.sabor-card.selected{
  border-color:var(--azul);
  box-shadow:0 0 10px rgba(74,144,226,.4);
}
.sabor-nome{
  font-size:18px;
  font-weight:bold;
}
.sabor-preco{
  color:var(--azul);
  margin-top:8px;
}
.extra-list {
  max-height: 140px;
  overflow-y: auto;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  margin-top: 8px;
  display: none;
}
.extra-item {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.extra-item input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
}
#carrinho{
  margin-top:10px;
}
.item-carrinho{
  background:var(--card2);
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
}
.total{
  font-size:24px;
  font-weight:bold;
  color:var(--azul);
  text-align:right;
  margin-top:10px;
}
.entrega-taxa {
  color: var(--azul);
  margin-top: 8px;
  font-weight: 600;
}
.rodape{
  position:sticky;
  bottom:0;
  background:var(--card);
  padding:15px;
  border-radius:15px;
  border:1px solid var(--border);
  margin-top:20px;
}
.adicionais-btn-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  cursor: pointer;
  user-select: none;
  color: var(--azul);
  font-weight: 600;
}
.adicionais-count {
  background: var(--azul);
  border-radius: 20px;
  padding: 2px 10px;
  color: white;
  font-size: 0.85rem;
}
@media(max-width:700px){
.logo h1{
  font-size:26px;
}
}
</style>
</head>
<body>
<div class="container">
<div class="logo" style="text-align:center;">
<h1>👑 KING VENTURA</h1>
<div style="display:flex; justify-content:center; align-items:center; gap:6px; margin:10px auto;">
<div style="width:50px; height:6px; background:#009246; border-radius:10px;"></div>
<div style="width:50px; height:6px; background:#ffffff; border-radius:10px;"></div>
<div style="width:50px; height:6px; background:#ce2b37; border-radius:10px;"></div>
</div>
<p>Monte seu pedido online</p>
</div>

<div class="card">
<h2>👤 Dados do Cliente</h2>
<label>Nome</label>
<input id="nome">
<label>Telefone</label>
<input id="telefone">
<label>CEP</label>
<input id="cep" maxlength="9" placeholder="Digite seu CEP">
<label>Rua</label>
<input id="rua" placeholder="Rua">
<label>Número</label>
<input id="numero" placeholder="Número">
<label>Bairro</label>
<input id="bairro" placeholder="Bairro">
<label>Observação</label>
<textarea id="observacao"></textarea>
</div>

<div class="card">
<h2>🍕 Escolha sua Pizza</h2>
<div class="grid grid-2">
  <div>
    <label for="tamanho">Tamanho</label>
    <select id="tamanho">
      <option value="grande">Grande 35cm</option>
      <option value="brotinho">Brotinho 25cm</option>
    </select>
  </div>
  <div>
    <label for="tipoPizza">Tipo</label>
    <select id="tipoPizza">
      <option value="inteira">Inteira</option>
      <option value="meio">Meio a Meio</option>
    </select>
  </div>
</div>

<div class="grid grid-2" style="margin-top: 12px;">
  <div>
    <label for="sabor1">Sabor 1</label>
    <select id="sabor1"></select>
  </div>
  <div id="boxSabor2" style="display:none;">
    <label for="sabor2">Sabor 2 (Meio a Meio)</label>
    <select id="sabor2"></select>
  </div>
</div>

<div id="ingredientes" style="margin-top:12px; font-size: 0.9rem; color: var(--muted);"></div>

<div class="adicionais-btn-row" id="btnMostrarAdicionais">
  ➕ Escolher Adicionais <span class="adicionais-count" id="contadorAdicionais">0</span>
</div>

<div class="extra-list" id="listaAdicionais"></div>

<button id="btnAdicionarPizza" class="btn" style="margin-top:15px;">Adicionar Pizza ao Carrinho</button>
</div>

<div class="card">
<h2>🥤 Bebidas</h2>
<select id="bebida">
  <option value="">Nenhuma</option>
  <option value="16">Coca-Cola 2L - R$ 16,00</option>
  <option value="10">Guaraná 1L - R$ 10,00</option>
  <option value="6">Coca-Cola Lata 310ml - R$ 6,00</option>
</select>
<button id="btnAdicionarBebida" class="btn" style="margin-top:12px;">Adicionar Bebida ao Carrinho</button>
</div>

<div class="card">
<h2>🛒 Carrinho</h2>
<div id="carrinho">
  <div class="item-carrinho">Nenhum item adicionado.</div>
</div>
<div class="total">R$ 0,00</div>
<div id="taxaEntregaArea" class="entrega-taxa"></div>
</div>

<div class="rodape">
<button id="btnFinalizarPedido" class="btn">📦 Finalizar Pedido</button>
</div>

</div>

<script>
const bairrosGratisAté3Km = ["jardim tarumã","copavilã","pendigo","nova laguna","laranjeiras"];
function textoLimpo(texto) {
  return texto.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function calcularTaxaEntrega(distanciaKm, bairro) {
  const bairroLimpo = textoLimpo(bairro);
  if (bairrosGratisAté3Km.includes(bairroLimpo) && distanciaKm <= 3) return 0;
  if (distanciaKm <= 3) return 0;
  let taxa = 5;
  const kmExtra = Math.max(0, distanciaKm - 3);
  taxa += kmExtra * 1.5;
  return Math.min(taxa, 20).toFixed(2);
}
function calcularDistanciaSimulada(cep, bairro) {
  const bairroLimpo = textoLimpo(bairro);
  if (bairrosGratisAté3Km.includes(bairroLimpo)) return 2.5;
  return 5;
}
function atualizarTaxaEntrega() {
  const cep = document.getElementById("cep").value;
  const bairro = document.getElementById("bairro").value;
  const taxaArea = document.getElementById("taxaEntregaArea");
  if (!cep || !bairro) {
    taxaArea.innerText = "Informe o CEP e o Bairro.";
    return;
  }
  const distanciaKm = calcularDistanciaSimulada(cep, bairro);
  const taxa = calcularTaxaEntrega(distanciaKm, bairro);
  taxaArea.innerText = taxa == 0 ? "🎉 Você ganhou entrega grátis!" : `Taxa de entrega: R$ ${taxa}`;
  atualizarCarrinho();
}
async function buscarPorCep() {
  const cepInput = document.getElementById("cep");
  let cep = cepInput.value.replace(/\D/g, '');
  if (cep.length !== 8) return;
  try {
    const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const dados = await resposta.json();
    if (dados.erro) return;
    document.getElementById("rua").value = dados.logradouro || "";
    document.getElementById("bairro").value = dados.bairro || "";
    atualizarTaxaEntrega();
  } catch {}
}
let timerBuscaRua = null;
async function buscarCepPelaRua() {
  clearTimeout(timerBuscaRua);
  timerBuscaRua = setTimeout(async () => {
    const ruaInput = document.getElementById("rua");
    const bairroInput = document.getElementById("bairro");
    const rua = ruaInput.value.trim();
    const bairro = bairroInput.value.trim();
    if (rua.length < 3) return;
    try {
      const url = `https://viacep.com.br/ws/ms/campo%20grande/${encodeURIComponent(rua)}/json/`;
      const resposta = await fetch(url);
      const lista = await resposta.json();
      if (Array.isArray(lista) && lista.length > 0) {
        let escolhido = lista[0];
        if (bairro) {
          const bairroLower = bairro.toLowerCase();
          const achado = lista.find(e=> e.bairro && e.bairro.toLowerCase() === bairroLower);
          if (achado) escolhido = achado;
        }
        if (escolhido) {
          document.getElementById("cep").value = escolhido.cep || "";
          document.getElementById("bairro").value = escolhido.bairro || bairro;
          atualizarTaxaEntrega();
        }
      }
    } catch {}
  }, 600);
}
const SABORES = {
  "Muçarela": { brotinho: 15, grande: 35, ingredientes: ["Molho", "Muçarela", "Azeitonas", "Orégano"] },
  "Calabresa": { brotinho: 20, grande: 35, ingredientes: ["Molho", "Muçarela", "Calabresa", "Cebola", "Azeitonas", "Orégano"] },
  "Catupiry": { brotinho: 20, grande: 35, ingredientes: ["Molho", "Muçarela", "Catupiry", "Azeitonas", "Orégano"] },
  "Calabresa com Catupiry": { brotinho: 20, grande: 40, ingredientes: ["Molho", "Muçarela", "Calabresa", "Catupiry", "Azeitonas", "Orégano"] },
  "Frango com Catupiry": { brotinho: 20, grande: 40, ingredientes: ["Molho", "Muçarela", "Frango Desfiado", "Catupiry", "Azeitonas", "Orégano"] },
  "Presunto": { brotinho: 20, grande: 35, ingredientes: ["Molho", "Muçarela", "Presunto", "Cebola", "Azeitonas", "Orégano"] },
  "Presunto com Catupiry": { brotinho: 20, grande: 40, ingredientes: ["Molho", "Muçarela", "Presunto", "Catupiry", "Azeitonas", "Orégano"] },
  "Brasileira": { brotinho: 20, grande: 40, ingredientes: ["Molho", "Muçarela", "Milho Verde", "Ervilha", "Cebola", "Azeitonas", "Orégano"] },
  "Frango com Milho e Tomate": { brotinho: 20, grande: 40, ingredientes: ["Molho", "Muçarela", "Frango Desfiado", "Milho Verde", "Tomate", "Azeitonas", "Orégano"] },
  "Baiana": { brotinho: 23, grande: 40, ingredientes: ["Molho", "Muçarela", "Calabresa", "Bacon", "Molho de Pimenta", "Cebola", "Azeitonas", "Orégano"] },
  "Bacon": { brotinho: 23, grande: 40, ingredientes: ["Molho", "Muçarela", "Bacon", "Cebola", "Azeitonas", "Orégano"] },
  "Cremosa": { brotinho: 23, grande: 40, ingredientes: ["Molho", "Muçarela", "Catupiry", "Creme de Leite", "Azeitonas", "Orégano"] },
  "Lombo ao Creme": { brotinho: 23, grande: 40, ingredientes: ["Molho", "Muçarela", "Lombinho", "Creme de Leite", "Azeitonas", "Orégano"] }
};
const ADICIONAIS = [
  { nome: "Catupiry Extra", valor: 4 },
  { nome: "Presunto Extra", valor: 4 },
  { nome: "Cebola Extra", valor: 4 },
  { nome: "Milho Extra", valor: 4 },
  { nome: "Ervilha Extra", valor: 4 },
  { nome: "Muçarela Extra", valor: 5 },
  { nome: "Bacon Extra", valor: 5 }
];
let carrinho = [];
function montarListaAdicionais() {
  const container = document.getElementById("listaAdicionais");
  container.innerHTML = "";
  ADICIONAIS.forEach(({nome, valor}) => {
    const label = document.createElement("label");
    label.className = "extra-item";
    label.innerHTML = `<input type="checkbox" data-nome="${nome}" value="${valor}"> ${nome} (+R$ ${valor.toFixed(2)})`;
    container.appendChild(label);
  });
  container.querySelectorAll("input[type=checkbox]").forEach(input => {
    input.addEventListener("change", atualizarContadorAdicionais);
  });
}
function atualizarContadorAdicionais() {
  const selecionados = document.querySelectorAll("#listaAdicionais input[type=checkbox]:checked").length;
  const contador = document.getElementById("contadorAdicionais");
  contador.textContent = selecionados > 0 ? selecionados : "";
}
document.getElementById("btnMostrarAdicionais").addEventListener("click", () => {
  const lista = document.getElementById("listaAdicionais");
  if (lista.style.display === "block") {
    lista.style.display = "none";
  } else {
    lista.style.display = "block";
  }
});
function carregarSabores() {
  const tamanho = document.getElementById("tamanho").value;
  const sabor1 = document.getElementById("sabor1");
  const sabor2 = document.getElementById("sabor2");
  const tipoPizza = document.getElementById("tipoPizza");
  const selecionado1 = sabor1.value;
  const selecionado2 = sabor2.value;
  sabor1.innerHTML = `<option value="">Selecione um sabor</option>`;
  sabor2.innerHTML = `<option value="">Selecione um sabor</option>`;
  Object.keys(SABORES).forEach(nome => {
    const preco = tamanho === "brotinho" ? SABORES[nome].brotinho : SABORES[nome].grande;
    sabor1.insertAdjacentHTML("beforeend", `<option value="${nome}">${nome} - R$ ${preco.toFixed(2)}</option>`);
    sabor2.insertAdjacentHTML("beforeend", `<option value="${nome}">${nome} - R$ ${preco.toFixed(2)}</option>`);
  });
  sabor1.value = selecionado1 && SABORES[selecionado1] ? selecionado1 : "";
  sabor2.value = selecionado2 && SABORES[selecionado2] ? selecionado2 : "";
  if(tamanho === "brotinho") {
    tipoPizza.value = "inteira";
    tipoPizza.disabled = true;
    document.getElementById("boxSabor2").style.display = "none";
  } else {
    tipoPizza.disabled = false;
    document.getElementById("boxSabor2").style.display = tipoPizza.value === "meio" ? "block" : "none";
  }
  atualizarIngredientesPreview();
}
function atualizarIngredientesPreview() {
  const tamanho = document.getElementById("tamanho").value;
  const tipo = document.getElementById("tipoPizza").value;
  const s1 = document.getElementById("sabor1").value;
  const s2 = document.getElementById("sabor2").value;
  const el = document.getElementById("ingredientes");
  if(!s1 || !SABORES[s1]) {
    el.innerText = "";
    return;
  }
  if(tamanho === "grande" && tipo === "meio" && s2 && SABORES[s2]) {
    el.innerText = `Ingredientes — 50% ${s1}: ${SABORES[s1].ingredientes.join(", ")} | 50% ${s2}: ${SABORES[s2].ingredientes.join(", ")}`;
  } else {
    el.innerText = `Ingredientes: ${SABORES[s1].ingredientes.join(", ")}`;
  }
}
function atualizarCarrinho() {
  const container = document.getElementById("carrinho");
  const totalEl = document.querySelector(".total");
  if (carrinho.length === 0) {
    container.innerHTML = `<div class="item-carrinho">Nenhum item adicionado.</div>`;
    totalEl.innerText = "R$ 0,00";
    atualizarTaxaEntrega(); 
    return;
  }
  container.innerHTML = carrinho.map((item, idx) => `
    <div class="item-carrinho">
      <b>${item.descricao}</b><br/>
      ${item.ingredientes ? `<span style="color: var(--muted); font-size: 0.85rem;">${item.ingredientes}</span><br/>` : ""}
      ${item.observacao ? `<span style="color: var(--azul); font-size: 0.85rem;">Obs: ${item.observacao}</span><br/>` : ""}
      <div style="margin-top:6px; display:flex; justify-content:space-between; align-items:center;">
        <strong>R$ ${item.valor.toFixed(2)}</strong>
        <button type="button" onclick="removerItem(${idx})" style="background:#ce2b37; border:none; border-radius:6px; color:#fff; cursor:pointer; padding:4px 8px;">Excluir</button>
      </div>
    </div>
  `).join("");
  const subtotal = carrinho.reduce((a, i) => a + i.valor, 0);
  const cep = document.getElementById("cep").value;
  const bairro = document.getElementById("bairro").value;
  const distanciaKm = calcularDistanciaSimulada(cep, bairro);
  const taxa = Number(calcularTaxaEntrega(distanciaKm, bairro));
  const total = subtotal + taxa;
  totalEl.innerText = "R$ " + total.toFixed(2);
  atualizarTaxaEntrega(); // só pra mostrar mensagem na área taxa
}
function removerItem(idx) {
  carrinho.splice(idx, 1);
  atualizarCarrinho();
}
document.getElementById("btnAdicionarPizza").addEventListener("click", () => {
  const tamanho = document.getElementById("tamanho").value;
  const tipo = document.getElementById("tipoPizza").value;
  const sabor1 = document.getElementById("sabor1").value;
  const sabor2 = document.getElementById("sabor2").value;
  if (!sabor1 || !SABORES[sabor1]) {
    alert("Escolha o sabor 1.");
    return;
  }
  if (tamanho === "brotinho" && tipo !== "inteira") {
    alert("Brotinho só aceita pizza inteira.");
    return;
  }
  if (tipo === "meio" && (!sabor2 || !SABORES[sabor2])) {
    alert("Escolha o sabor 2 para pizza meio a meio.");
    return;
  }
  let descricao = "";
  let valor = 0;
  let ingredientes = "";
  if (tamanho === "brotinho") {
    descricao = `Brotinho 25cm - ${sabor1}`;
    valor = SABORES[sabor1].brotinho;
    ingredientes = SABORES[sabor1].ingredientes.join(", ");
  } else if (tipo === "meio") {
    descricao = `Grande 35cm Meio a Meio - ${sabor1} / ${sabor2}`;
    valor = Math.max(SABORES[sabor1].grande, SABORES[sabor2].grande);
    ingredientes = `50% ${sabor1}: ${SABORES[sabor1].ingredientes.join(", ")} | 50% ${sabor2}: ${SABORES[sabor2].ingredientes.join(", ")}`;
  } else {
    descricao = `Grande 35cm - ${sabor1}`;
    valor = SABORES[sabor1].grande;
    ingredientes = SABORES[sabor1].ingredientes.join(", ");
  }
  const adicionaisSelecionados = Array.from(document.querySelectorAll("#listaAdicionais input:checked"))
    .map(e => ({
      nome: e.dataset.nome,
      valor: Number(e.value)
    }));
  const valorAdicional = adicionaisSelecionados.reduce((acc, a) => acc + a.valor, 0);
  const nomesAdicionais = adicionaisSelecionados.map(a => a.nome);
  if (nomesAdicionais.length) {
    descricao += " + " + nomesAdicionais.join(", ");
  }
  valor += valorAdicional;
  carrinho.push({
    tipo: "pizza",
    descricao,
    ingredientes,
    observacao: "",
    valor
  });
  atualizarCarrinho();
  document.querySelectorAll("#listaAdicionais input:checked").forEach(i => i.checked = false);
  atualizarContadorAdicionais();
  alert("Pizza adicionada ao carrinho!");
});
document.getElementById("btnAdicionarBebida").addEventListener("click", () => {
  const sel = document.getElementById("bebida");
  if (!sel.value) {
    alert("Selecione uma bebida.");
    return;
  }
  const descricao = sel.options[sel.selectedIndex].text.split(" - ")[0];
  const valor = Number(sel.value);
  carrinho.push({
    tipo: "bebida",
    descricao,
    ingredientes: "",
    observacao: "",
    valor
  });
  atualizarCarrinho();
  alert("Bebida adicionada ao carrinho!");
  sel.value = "";
});
document.getElementById("tamanho").addEventListener("change", carregarSabores);
document.getElementById("tipoPizza").addEventListener("change", () => {
  carregarSabores();
  document.getElementById("boxSabor2").style.display = document.getElementById("tipoPizza").value === "meio" ? "block" : "none";
});
document.getElementById("sabor1").addEventListener("change", atualizarIngredientesPreview);
document.getElementById("sabor2").addEventListener("change", atualizarIngredientesPreview);
document.getElementById("cep").addEventListener("input", () => {
  if (document.getElementById("cep").value.replace(/\D/g, '').length === 8) {
    buscarPorCep();
  }
});
document.getElementById("rua").addEventListener("input", () => buscarCepPelaRua());
document.getElementById("bairro").addEventListener("input", atualizarTaxaEntrega);
document.getElementById("numero").addEventListener("input", atualizarTaxaEntrega);
montarListaAdicionais();
carregarSabores();
atualizarTaxaEntrega();
atualizarContadorAdicionais();

// Monta mensagem do pedido para WhatsApp
function montarTextoPedido() {
  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const cep = document.getElementById("cep").value.trim();
  const rua = document.getElementById("rua").value.trim();
  const numero = document.getElementById("numero").value.trim();
  const bairro = document.getElementById("bairro").value.trim();
  const observacao = document.getElementById("observacao").value.trim();
  const distanciaKm = calcularDistanciaSimulada(cep, bairro);
  const taxaEntrega = calcularTaxaEntrega(distanciaKm, bairro);

  let texto = "KING VENTURA PIZZARIA\n\n";
  texto += `Cliente: ${nome}\n`;
  texto += `Telefone: ${telefone}\n`;
  texto += `Endereço: ${rua} nº ${numero}, ${bairro}\n`;
  texto += `CEP: ${cep}\n`;
  texto += `Observação: ${observacao}\n\n`;
  texto += "ITENS DO PEDIDO:\n";

  carrinho.forEach((item, i) => {
    texto += `${i+1}. ${item.descricao} - R$ ${item.valor.toFixed(2)}\n`;
    if (item.ingredientes) texto += `   Ingredientes: ${item.ingredientes}\n`;
    if(item.observacao) texto += `   Obs: ${item.observacao}\n`;
  });

  texto += `\nTaxa de Entrega: R$ ${taxaEntrega}\n`;
  const total = carrinho.reduce((acc, item) => acc + item.valor, 0) + Number(taxaEntrega);
  texto += `TOTAL: R$ ${total.toFixed(2)}\n`;
  return texto;
}

// Botão finalizar pedido
document.getElementById("btnFinalizarPedido").addEventListener("click", () => {
  if (carrinho.length === 0) {
    alert("Adicione algum item ao carrinho antes de finalizar.");
    return;
  }
  const texto = montarTextoPedido();
  const numeroWhats = "5567991476156";
  const url = "https://wa.me/" + numeroWhats + "?text=" + encodeURIComponent(texto);
  window.open(url, "_blank");
});

</script>
