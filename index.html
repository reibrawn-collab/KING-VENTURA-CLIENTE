<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>King Ventura Cliente</title>
<style>
  :root {
    --bg-dark: #05080f;
    --card-dark: #0b1526;
    --card2-dark: #132241;
    --border-dark: #1e3560;
    --azul-dark: #4a90e2;
    --texto-dark: #ffffff;
    --muted-dark: #9fb4d6;
    --gold-dark: #4a90e2;
    --danger-dark: #cf4638;

    --bg-light: #eef3fb;
    --card-light: #ffffff;
    --card2-light: #e3ecf9;
    --border-light: #b9cdea;
    --azul-light: #1b4f9c;
    --texto-light: #08203f;
    --muted-light: #4a6a94;
    --gold-light: #1b4f9c;
    --danger-light: #b8302a;
  }

  body[data-tema="escuro"] {
    --bg: var(--bg-dark);
    --card: var(--card-dark);
    --card2: var(--card2-dark);
    --border: var(--border-dark);
    --azul: var(--azul-dark);
    --texto: var(--texto-dark);
    --muted: var(--muted-dark);
    --gold: var(--gold-dark);
    --danger: var(--danger-dark);
  }

  body[data-tema="claro"] {
    --bg: var(--bg-light);
    --card: var(--card-light);
    --card2: var(--card2-light);
    --border: var(--border-light);
    --azul: var(--azul-light);
    --texto: var(--texto-light);
    --muted: var(--muted-light);
    --gold: var(--gold-light);
    --danger: var(--danger-light);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
  }
  body {
    background: var(--bg);
    color: var(--texto);
    padding: 16px;
    line-height: 1.45;
    transition: background-color 0.3s, color 0.3s;
  }
  .container {
    max-width: 900px;
    margin: auto;
  }
  .brand-header {
    text-align: center;
    margin-bottom: 20px;
  }
  .logo h1 {
    color: var(--azul);
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
  }
  .logo h1 div:last-child {
    margin-top: 6px;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .logo p {
    color: var(--muted);
    font-size: 18px;
    margin-top: 6px;
  }
  .mode-toggle-container {
    margin-top: 12px;
  }
  button.mode-toggle {
    padding: 6px 20px;
    font-weight: 600;
    font-size: 0.875rem;
    border-radius: 8px;
    background: var(--azul);
    color: white;
    border: none;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.3s ease;
  }
  button.mode-toggle:hover {
    background-color: #3671c6;
  }

  .italian-stripes {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
    margin-bottom: 18px;
  }
  .italian-stripes div {
    width: 50px;
    height: 10px;
    border-radius: 5px;
  }
  .green { background-color: #008C45; }
  .white { background-color: #F4F5F0; }
  .red { background-color: #CD212A; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
    transition: background-color 0.3s, border-color 0.3s;
  }
  .card h2 {
    color: var(--azul);
    margin-bottom: 15px;
  }
  label {
    display: block;
    margin-top: 10px;
    color: var(--muted);
  }
  input, select, textarea {
    width: 100%;
    background: var(--card2);
    color: var(--texto);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-top: 8px;
    transition: background-color 0.3s, border-color 0.3s, color 0.3s;
  }
  select {
    cursor:pointer;
    appearance:none;
    padding-right: 30px;
    background-image: url('data:image/svg+xml;charset=US-ASCII,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="white"><polygon points="0,0 14,0 7,7"/></svg>');
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:10px;
  }
  .grid {
    display: grid;
    gap: 12px;
  }
  .grid-2 {
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  }
  button {
    cursor: pointer;
    border: none;
    background: var(--azul);
    color: white;
    padding: 12px;
    border-radius: 10px;
    width: 100%;
    font-weight: bold;
    font-size: 1rem;
    margin-top: 10px;
    transition: background-color 0.3s;
    white-space: nowrap;
  }
  button:hover, button.mode-toggle:hover {
    opacity: 0.9;
  }
  #ingredientes {
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--muted);
    min-height: 40px;
    font-style: italic;
  }
  .extra-list {
    display: none;
    max-height: 140px;
    overflow-y: auto;
    margin-top: 6px;
    padding-left: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card2);
  }
  .extra-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    color: var(--texto);
  }
  .extra-item label {
    cursor: pointer;
    flex: 1;
  }
  .extra-item input {
    margin-right: 8px;
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    cursor: pointer;
  }

  #carrinho {
    margin-top: 10px;
  }
  .item-carrinho {
    display: flex;
    flex-direction: column; /* Para garantir que o texto fique acima e o botão abaixo */
    gap: 8px;
    background: var(--card2);
    border-radius: 10px;
    margin-bottom: 8px;
    padding: 10px 16px;
    word-break: normal;
  }
  .item-carrinho > div {
    /* Corrigindo quebra indesejada de linha no texto do pedido */
    white-space: nowrap;
    overflow-wrap: normal;
    flex-grow: 1;
    text-overflow: ellipsis;
    overflow: hidden;
  }
  .item-carrinho button {
    align-self: flex-start; /* Para que o botão fique alinhado à esquerda dentro do container */
    background: var(--danger);
    border: none;
    border-radius: 6px;
    color: white;
    padding: 6px 14px;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .total {
    font-size: 24px;
    font-weight: bold;
    color: var(--azul);
    text-align: right;
    margin-top: 10px;
  }
  .entrega-taxa {
    color: var(--azul);
    font-weight: 700;
    margin-top: 10px;
    text-align: right;
  }
  footer {
    text-align: center;
    margin: 20px 0;
    font-weight: 700;
    font-size: 1.1rem;
    color: #CD212A;
  }
  footer a {
    color: #008C45;
    text-decoration: none;
  }
  footer a:hover {
    text-decoration: underline;
  }
  @media (max-width: 700px) {
    .logo h1 {
      font-size: 26px;
    }
  }
</style>
</head>
<body data-tema="escuro">
<div class="container">
  <div class="brand-header">
    <div class="logo">
      <h1>
        <div>KING</div>
        <div>VENTURA</div>
        <div>PIZZARIA</div>
      </h1>
      <div class="italian-stripes">
        <div class="green"></div>
        <div class="white"></div>
        <div class="red"></div>
      </div>
      <p>Monte seu pedido online</p>
      <div class="mode-toggle-container">
        <button id="btnTema" class="mode-toggle" type="button" aria-label="Alternar modo claro/escuro">
          🌙 Escuro
        </button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🍕 Escolha sua Pizza</h2>
    <div class="grid grid-2">
      <div>
        <label for="tamanho">Tamanho</label>
        <select id="tamanho" aria-describedby="ingredientes">
          <option value="brotinho">Brotinho 25cm (1 sabor)</option>
          <option value="grande">Grande 35cm</option>
        </select>
      </div>
      <div>
        <label for="tipoPizza">Tipo</label>
        <select id="tipoPizza" aria-describedby="ingredientes">
          <option value="inteira">Inteira</option>
          <option value="meio">Meio a Meio</option>
        </select>
      </div>
    </div>

    <div class="grid grid-2" style="margin-top: 15px;">
      <div>
        <label for="sabor1">Sabor 1</label>
        <select id="sabor1" aria-describedby="ingredientes"></select>
      </div>
      <div id="boxSabor2" style="display:none;">
        <label for="sabor2">Sabor 2 (Meio a Meio)</label>
        <select id="sabor2" aria-describedby="ingredientes"></select>
      </div>
    </div>

    <div id="ingredientes"></div>

    <div class="btn-toggle-adicionais" id="btnToggleAdicionais" tabindex="0">
      ➕ Adicionais <span class="adicional-count" id="adicionalCount">0</span>
    </div>
    <div class="extra-list" id="listaAdicionais" role="region" aria-label="Lista de adicionais"></div>

    <label for="obsPizza" style="margin-top: 15px;">Observação da Pizza</label>
    <input id="obsPizza" placeholder="Ex: sem cebola, assar bem" />

    <button id="btnAdicionarPizza">Adicionar Pizza ao Carrinho</button>
  </div>

  <div class="card">
    <h2>🥤 Bebidas</h2>
    <label for="bebida">Escolha sua bebida</label>
    <select id="bebida">
      <option value="">Nenhuma</option>
      <option value="16">Coca-Cola 2L - R$ 16,00</option>
      <option value="10">Guaraná 1L - R$ 10,00</option>
      <option value="6">Coca-Cola Lata 310ml - R$ 6,00</option>
    </select>
    <button id="btnAdicionarBebida" style="margin-top: 12px;">Adicionar Bebida ao Carrinho</button>
  </div>

  <div class="card">
    <h2>👤 Dados do Cliente</h2>
    <label for="nome">Nome</label>
    <input id="nome" placeholder="Nome completo" />
    <label for="telefone">Telefone</label>
    <input id="telefone" placeholder="(67) 99999-9999" />
    <label for="cep">CEP</label>
    <input id="cep" maxlength="9" placeholder="Digite seu CEP" />
    <label for="rua">Rua</label>
    <input id="rua" placeholder="Rua" />
    <label for="numero">Número</label>
    <input id="numero" placeholder="Número" />
    <label for="bairro">Bairro</label>
    <input id="bairro" placeholder="Bairro" />
    <label for="observacao">Observação</label>
    <textarea id="observacao" placeholder="Ponto de referência, troco, etc."></textarea>
  </div>

  <div class="card">
    <h2>🛒 Carrinho</h2>
    <div id="carrinho"><div class="item-carrinho">Nenhum item adicionado.</div></div>
    <div class="entrega-taxa" id="taxaEntregaArea"></div>
    <div class="total" id="totalPedido">R$ 0,00</div>
  </div>

  <button id="btnFinalizarPedido" style="margin-top:12px;">📦 Finalizar Pedido</button>
</div>

<footer>
  Siga a gente no Instagram <a href="https://instagram.com/kingventura_pizzaria" target="_blank">@kingventura_pizzaria</a> 🚀
</footer>

<script>
  const numeroWhats = "5567991476156";

  const SABORES = {
    "Muçarela": {brotinho:15, grande:35, ingredientes:["molho", "muçarela", "azeitonas", "orégano"]},
    "Calabresa": {brotinho:20, grande:35, ingredientes:["molho", "muçarela", "calabresa", "cebola", "azeitonas", "orégano"]},
    "Catupiry": {brotinho:20, grande:35, ingredientes:["molho", "muçarela", "catupiry", "azeitonas", "orégano"]},
    "Calabresa com Catupiry": {brotinho:20, grande:40, ingredientes:["molho", "muçarela", "calabresa", "catupiry","azeitonas", "orégano"]},
    "Frango com Catupiry": {brotinho:20, grande:40, ingredientes:["molho", "muçarela", "frango desfiado", "catupiry", "azeitonas", "orégano"]},
    "Presunto": {brotinho:20, grande:35, ingredientes:["molho", "muçarela", "presunto", "cebola", "azeitonas", "orégano"]},
    "Presunto com Catupiry": {brotinho:20, grande:40, ingredientes:["molho", "muçarela", "presunto", "catupiry", "azeitonas", "orégano"]},
    "Brasileira": {brotinho:20, grande:40, ingredientes:["molho", "muçarela", "milho verde", "ervilha", "cebola", "azeitonas", "orégano"]},
    "Frango com Milho e Tomate": {brotinho:20, grande:40, ingredientes:["molho", "muçarela", "frango desfiado", "milho verde", "tomate", "azeitonas", "orégano"]},
    "Baiana": {brotinho:23, grande:40, ingredientes:["molho", "muçarela", "calabresa", "bacon", "molho de pimenta", "cebola", "azeitonas", "orégano"]},
    "Bacon": {brotinho:23, grande:40, ingredientes:["molho", "muçarela", "bacon", "cebola", "azeitonas", "orégano"]},
    "Cremosa": {brotinho:23, grande:40, ingredientes:["molho", "muçarela", "catupiry", "creme de leite", "azeitonas", "orégano"]},
    "Lombo ao Creme": {brotinho:23, grande:40, ingredientes:["molho", "muçarela", "lombinho", "creme de leite", "azeitonas", "orégano"]}
  };

  const ADICIONAIS = [
    {nome:"Catupiry Extra", valor:4},
    {nome:"Presunto Extra", valor:4},
    {nome:"Cebola Extra", valor:4},
    {nome:"Milho Extra", valor:4},
    {nome:"Ervilha Extra", valor:4},
    {nome:"Muçarela Extra", valor:5},
    {nome:"Bacon Extra", valor:5}
  ];

  let carrinho = [];

  function formarListaIngredientes(ingredientes){
    if(ingredientes.length <=1) return ingredientes.join("");
    return ingredientes.slice(0, ingredientes.length-1).join(", ") + " e " + ingredientes[ingredientes.length-1];
  }

  function carregarSabores() {
    const tamanho = document.getElementById("tamanho").value;
    const tipoPizzaEl = document.getElementById("tipoPizza");
    const boxSabor2 = document.getElementById("boxSabor2");

    if (tamanho === "brotinho") {
      tipoPizzaEl.value = "inteira";
      tipoPizzaEl.disabled = true;
      boxSabor2.style.display = "none";
    } else {
      tipoPizzaEl.disabled = false;
      boxSabor2.style.display = tipoPizzaEl.value === "meio" ? "block" : "none";
    }

    const sabor1El = document.getElementById("sabor1");
    const sabor2El = document.getElementById("sabor2");
    const prev1 = sabor1El.value;
    const prev2 = sabor2El.value;

    sabor1El.innerHTML = '<option value="">Selecione um sabor</option>';
    sabor2El.innerHTML = '<option value="">Selecione um sabor</option>';

    Object.entries(SABORES).forEach(([nome, dados]) => {
      const preco = tamanho==="brotinho"?dados.brotinho:dados.grande;
      const ings = formarListaIngredientes(dados.ingredientes);
      const texto = `${nome} - R$ ${preco.toFixed(2)} (${ings})`;
      sabor1El.innerHTML += `<option value="${nome}">${texto}</option>`;
      sabor2El.innerHTML += `<option value="${nome}">${texto}</option>`;
    });

    sabor1El.value = prev1 && SABORES[prev1]?prev1:"";
    sabor2El.value = prev2 && SABORES[prev2]?prev2:"";

    atualizarPreviewIngredientes();
  }

  function atualizarPreviewIngredientes() {
    const s1 = document.getElementById("sabor1").value;
    const s2 = document.getElementById("sabor2").value;
    const tamanho = document.getElementById("tamanho").value;
    const tipo = document.getElementById("tipoPizza").value;
    const el = document.getElementById("ingredientes");

    if(!s1 || !SABORES[s1]){
      el.innerText = "";
      return;
    }

    if(tamanho==="grande" && tipo==="meio" && s2 && SABORES[s2]){
      el.innerText = `Ingredientes — 50% ${s1}: ${formarListaIngredientes(SABORES[s1].ingredientes)} | 50% ${s2}: ${formarListaIngredientes(SABORES[s2].ingredientes)}`;
    } else {
      el.innerText = `Ingredientes: ${formarListaIngredientes(SABORES[s1].ingredientes)}`;
    }
  }

  function montarListaAdicionais() {
    const container = document.getElementById("listaAdicionais");
    container.innerHTML = "";
    ADICIONAIS.forEach(({nome, valor}) => {
      const label = document.createElement("label");
      label.classList.add("extra-item");
      label.innerHTML = `<input type="checkbox" value="${valor}" data-nome="${nome}"> ${nome} (+R$ ${valor.toFixed(2)})`;
      container.appendChild(label);
    });
  }

  function atualizarTextoAdicionais() {
    const marcados = document.querySelectorAll("#listaAdicionais input:checked");
    const qtd = marcados.length;
    const btn = document.getElementById("btnToggleAdicionais");
    const count = document.getElementById("adicionalCount");
    count.textContent = qtd;
    if(qtd === 0){
      btn.textContent = "➕ Adicionais ";
      btn.appendChild(count);
    } else {
      btn.textContent = `➕ Adicionais (${qtd}) `;
      btn.appendChild(count);
    }
  }

  function atualizarCarrinho() {
    const container = document.getElementById("carrinho");
    if(carrinho.length === 0){
      container.innerHTML = '<div class="item-carrinho">Nenhum item adicionado.</div>';
      document.getElementById("totalPedido").textContent = "R$ 0,00";
      document.getElementById("taxaEntregaArea").textContent = "";
      return;
    }

    container.innerHTML = carrinho.map((item, idx) => `
      <div class="item-carrinho">
        <div>
          <b>${item.descricao}</b>
          ${item.ingredientes ? `<div style="font-style: italic; color: var(--muted); font-size: 0.85rem;">${item.ingredientes}</div>` : ""}
          ${item.observacao ? `<div style="color: var(--azul); font-size: 0.85rem;">Obs: ${item.observacao}</div>` : ""}
        </div>
        <button type="button" onclick="removerItem(${idx})" aria-label="Remover item do carrinho">Excluir</button>
      </div>
    `).join("");

    const total = carrinho.reduce((sum,item) => sum+item.valor, 0);
    document.getElementById("totalPedido").textContent = `R$ ${total.toFixed(2)}`;
    document.getElementById("taxaEntregaArea").textContent = "🎉 Você ganhou entrega grátis!";
  }

  function removerItem(idx) {
    carrinho.splice(idx,1);
    atualizarCarrinho();
  }

  document.getElementById("tamanho").addEventListener("change", carregarSabores);
  document.getElementById("tipoPizza").addEventListener("change", () => {
    const tamanho = document.getElementById("tamanho").value;
    const tipoPizzaEl = document.getElementById("tipoPizza");
    const boxSabor2 = document.getElementById("boxSabor2");
    if(tamanho==="brotinho"){
      tipoPizzaEl.value = "inteira";
      tipoPizzaEl.disabled = true;
      boxSabor2.style.display = "none";
    } else {
      tipoPizzaEl.disabled = false;
      boxSabor2.style.display = tipoPizzaEl.value==="meio"?"block":"none";
    }
    atualizarPreviewIngredientes();
  });
  document.getElementById("sabor1").addEventListener("change", atualizarPreviewIngredientes);
  document.getElementById("sabor2").addEventListener("change", atualizarPreviewIngredientes);

  document.getElementById("btnToggleAdicionais").addEventListener("click", () => {
    const lista = document.getElementById("listaAdicionais");
    if(lista.style.display==="block"){
      lista.style.display="none";
      atualizarTextoAdicionais();
    } else {
      lista.style.display="block";
      document.getElementById("btnToggleAdicionais").textContent = "➖ Ocultar Adicionais ";
      document.getElementById("btnToggleAdicionais").appendChild(document.getElementById("adicionalCount"));
    }
  });

  document.getElementById("listaAdicionais").addEventListener("change", atualizarTextoAdicionais);

  document.getElementById("btnAdicionarPizza").addEventListener("click", () => {
    const tamanho = document.getElementById("tamanho").value;
    const tipo = document.getElementById("tipoPizza").value;
    const s1 = document.getElementById("sabor1").value;
    const s2 = document.getElementById("sabor2").value;
    if(!s1 || !SABORES[s1]){
      alert("Selecione o sabor 1.");
      return;
    }
    if(tamanho==="brotinho" && tipo !== "inteira"){
      alert("Brotinho só aceita pizza inteira.");
      return;
    }
    if(tipo==="meio" && (!s2 || !SABORES[s2])){
      alert("Selecione o sabor 2 para pizza Meio a Meio.");
      return;
    }
    let descricao = "";
    let valor = 0;
    let ingredientes = "";
    if(tamanho==="brotinho"){
      descricao = `Brotinho 25cm - ${s1}`;
      valor = SABORES[s1].brotinho;
      ingredientes = SABORES[s1].ingredientes.join(", ");
    } else if(tipo==="meio"){
      descricao = `Grande 35cm Meio a Meio - ${s1} / ${s2}`;
      valor = Math.max(SABORES[s1].grande, SABORES[s2].grande);
      ingredientes = `50% ${s1}: ${SABORES[s1].ingredientes.join(", ")} | 50% ${s2}: ${SABORES[s2].ingredientes.join(", ")}`;
    } else {
      descricao = `Grande 35cm - ${s1}`;
      valor = SABORES[s1].grande;
      ingredientes = SABORES[s1].ingredientes.join(", ");
    }
    const adicionaisSelecionados = [];
    let valorAdicional = 0;
    document.querySelectorAll("#listaAdicionais input:checked").forEach(input => {
      adicionaisSelecionados.push(input.dataset.nome);
      valorAdicional += Number(input.value);
    });
    if(adicionaisSelecionados.length){
      descricao += " + " + adicionaisSelecionados.join(", ");
      valor += valorAdicional;
    }
    const obs = document.getElementById("obsPizza").value.trim();
    carrinho.push({descricao, ingredientes, observacao: obs, valor});
    atualizarCarrinho();
    document.querySelectorAll("#listaAdicionais input").forEach(i => i.checked=false);
    atualizarTextoAdicionais();
    document.getElementById("obsPizza").value = "";
    alert("Pizza adicionada ao carrinho!");
  });

  document.getElementById("btnAdicionarBebida").addEventListener("click", () => {
    const sel = document.getElementById("bebida");
    if(!sel.value){
      alert("Selecione uma bebida.");
      return;
    }
    const descricao = sel.options[sel.selectedIndex].text.split(" - ")[0];
    const valor = Number(sel.value);
    carrinho.push({descricao, ingredientes:"", observacao:"", valor});
    atualizarCarrinho();
    sel.value = "";
    alert("Bebida adicionada ao carrinho!");
  });

  document.getElementById("btnFinalizarPedido").addEventListener("click", () => {
    if(carrinho.length === 0){
      alert("Adicione pelo menos um item ao carrinho antes de finalizar.");
      return;
    }
    const nome = document.getElementById("nome").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const cep = document.getElementById("cep").value.trim();
    const rua = document.getElementById("rua").value.trim();
    const numero = document.getElementById("numero").value.trim();
    const bairro = document.getElementById("bairro").value.trim();
    if(!nome || !telefone || !cep || !rua || !numero || !bairro){
      alert("Preencha todos os dados do cliente corretamente.");
      return;
    }
    let texto = `KING VENTURA PIZZARIA\n\nCliente: ${nome}\nTelefone: ${telefone}\nCEP: ${cep}\nEndereço: ${rua}\nNúmero: ${numero}\nBairro: ${bairro}\nObservação: ${document.getElementById("observacao").value.trim()}\n\nItens do Pedido:\n`;
    carrinho.forEach(item => {
      texto += `${item.descricao} - R$ ${item.valor.toFixed(2)}\n`;
      if(item.ingredientes) texto += `Ingredientes: ${item.ingredientes}\n`;
      if(item.observacao) texto += `Obs: ${item.observacao}\n`;
      texto += "\n";
    });
    texto += `TOTAL: ${document.getElementById("totalPedido").textContent}\n`;
    const urlWhats = `https://wa.me/${numeroWhats}?text=` + encodeURIComponent(texto);
    window.open(urlWhats, "_blank");
  });

  // Inicialização
  montarListaAdicionais();
  carregarSabores();
  atualizarTextoAdicionais();

  // Tema toggle
  const btnTema = document.getElementById("btnTema");
  btnTema.addEventListener("click", () => {
    const atual = document.body.getAttribute("data-tema");
    const novo = atual === "escuro" ? "claro" : "escuro";
    document.body.setAttribute("data-tema", novo);
    btnTema.textContent = novo === "escuro" ? "🌙 Escuro" : "☀️ Claro";
    localStorage.setItem("kv_tema", novo);
  });
  const temaSalvo = localStorage.getItem("kv_tema");
  if(temaSalvo){
    document.body.setAttribute("data-tema", temaSalvo);
    btnTema.textContent = temaSalvo === "escuro" ? "🌙 Escuro" : "☀️ Claro";
  }
</script>
</body>
</html>
