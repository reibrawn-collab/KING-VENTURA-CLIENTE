<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>King Ventura Cliente</title>
<style>
:root {
  --bg: #05080f;
  --card: #0b1526;
  --card2: #132241;
  --border: #1e3560;
  --azul: #4a90e2;
  --texto: #ffffff;
  --muted: #9fb4d6;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}
body {
  background: var(--bg);
  color: var(--texto);
  padding: 15px;
}
.container {
  max-width: 900px;
  margin: auto;
}
.logo {
  text-align: center;
  margin-bottom: 20px;
}
.logo h1 {
  color: var(--azul);
  font-size: 36px;
}
.logo p {
  color: var(--muted);
  font-size: 18px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 15px;
}
.card h2 {
  color: var(--azul);
  margin-bottom: 15px;
}
label {
  display: block;
  margin-top: 10px;
  color: var(--muted);
  cursor: pointer;
}
input,
select,
textarea {
  width: 100%;
  background: var(--card2);
  color: var(--texto);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-top: 8px;
  font-size: 1rem;
}
select {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  padding-right: 30px;
  background-image: url('data:image/svg+xml;charset=US-ASCII,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="white"><polygon points="0,0 14,0 7,7"/></svg>');
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 10px;
  cursor: pointer;
}
.grid {
  display: grid;
  gap: 12px;
}
.grid-2 {
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
}
.grid-4 {
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  display: grid;
}
button {
  cursor: pointer;
  border: none;
}
.btn {
  background: var(--azul);
  color: white;
  padding: 12px;
  border-radius: 10px;
  width: 100%;
  font-weight: bold;
  font-size: 1rem;
}
.btn:hover {
  opacity: 0.9;
}
#ingredientes {
  margin-top: 12px;
  font-size: 0.9rem;
  color: var(--muted);
  min-height: 40px;
}
#carrinho {
  margin-top: 10px;
}
.item-carrinho {
  background: var(--card2);
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 8px;
}
.total {
  font-size: 24px;
  font-weight: bold;
  color: var(--azul);
  text-align: right;
  margin-top: 10px;
}
.entrega-taxa {
  color: var(--azul);
  font-weight: 700;
  margin-top: 10px;
}
.rodape {
  position: sticky;
  bottom: 0;
  background: var(--card);
  padding: 15px;
  border-radius: 15px;
  border: 1px solid var(--border);
  margin-top: 20px;
  text-align: center;
  font-weight: 800;
  font-size: 1.1rem;
  color: #f4c542;
  text-shadow: 0 0 6px #f4c542aa;
}
.rodape a {
  color: #f4c542;
  text-decoration: none;
  font-weight: 900;
}
.rodape a:hover {
  text-decoration: underline;
}
@media (max-width: 700px) {
  .logo h1 {
    font-size: 26px;
  }
  .grid-4 {
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  }
}
</style>
</head>
<body>
<div class="container">
<div class="logo" style="text-align:center;">
<h1>👑 KING VENTURA</h1>
<div style="display:flex; justify-content:center; align-items:center; gap:6px; margin:10px auto;">
<div style="width:50px; height:6px; background:#009246; border-radius:10px;"></div>
<div style="width:50px; height:6px; background:#ffffff; border-radius:10px;"></div>
<div style="width:50px; height:6px; background:#ce2b37; border-radius:10px;"></div>
</div>
<p>Monte seu pedido online</p>
</div>

<div class="card">
  <h2>🍕 Escolha sua Pizza</h2>
  <div class="grid-4">
    <div>
      <label for="tamanho">Tamanho</label>
      <select id="tamanho">
        <option value="grande">Grande 35cm</option>
        <option value="brotinho">Brotinho 25cm</option>
      </select>
    </div>
    <div>
      <label for="tipoPizza">Tipo</label>
      <select id="tipoPizza">
        <option value="inteira">Inteira</option>
        <option value="meio">Meio a Meio</option>
      </select>
    </div>
    <div style="grid-column: span 2;">
      <label for="sabor1">Sabor 1</label>
      <select id="sabor1" title="Selecione um sabor"></select>
    </div>
  </div>

  <div id="boxSabor2" style="margin-top: 15px; display:none;">
    <label for="sabor2">Sabor 2 (Meio a Meio)</label>
    <select id="sabor2" title="Selecione um sabor"></select>
  </div>

  <div style="margin-top:15px;">
    <label for="listaAdicionais">➕ Adicionais</label>
    <select id="listaAdicionais" multiple style="height:110px;"></select>
  </div>

  <div id="ingredientes"></div>

  <button id="btnAdicionarPizza" class="btn" style="margin-top:15px;">Adicionar Pizza ao Carrinho</button>
</div>

<div class="card">
  <h2>🥤 Bebidas</h2>
  <select id="bebida">
    <option value="">Nenhuma</option>
    <option value="16">Coca-Cola 2L - R$ 16,00</option>
    <option value="10">Guaraná 1L - R$ 10,00</option>
    <option value="6">Coca-Cola Lata 310ml - R$ 6,00</option>
  </select>
  <button id="btnAdicionarBebida" class="btn" style="margin-top:12px;">Adicionar Bebida ao Carrinho</button>
</div>

<div class="card">
  <h2>👤 Dados do Cliente</h2>
  <label>Nome</label>
  <input id="nome" />
  <label>Telefone</label>
  <input id="telefone" />
  <label>CEP</label>
  <input id="cep" maxlength="9" placeholder="Digite seu CEP" />
  <label>Rua</label>
  <input id="rua" placeholder="Rua" />
  <label>Número</label>
  <input id="numero" placeholder="Número" />
  <label>Bairro</label>
  <input id="bairro" placeholder="Bairro" />
  <label>Observação</label>
  <textarea id="observacao"></textarea>
</div>

<div class="card">
  <h2>🛒 Carrinho</h2>
  <div id="carrinho">
    <div class="item-carrinho">Nenhum item adicionado.</div>
  </div>
  <div class="total">R$ 0,00</div>
  <div id="taxaEntregaArea" class="entrega-taxa"></div>
</div>

<div class="rodape">
  Siga a gente no Instagram <a href="https://instagram.com/kingventura_pizzaria" target="_blank" rel="noopener">@kingventura_pizzaria</a>
</div>

<div class="rodape">
  <button id="btnFinalizarPedido" class="btn">📦 Finalizar Pedido</button>
</div>
</div>

<script>
const bairrosGratisAté3Km = ["jardim tarumã","copavilã","pendigo","nova laguna","laranjeiras"];
function textoLimpo(txt){return txt.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function calcularTaxaEntrega(dist,kb){const b=textoLimpo(kb);if(bairrosGratisAté3Km.includes(b)&&dist<=3)return 0;if(dist<=3)return 0;let v=5;const e=Math.max(0,dist-3);v+=e*1.5;return Math.min(v,20).toFixed(2);}
function calcDistanciaSimulada(c,b){const bb=textoLimpo(b);if(bairrosGratisAté3Km.includes(bb))return 2.5;return 5;}
function formarListaIngredientes(i){if(i.length<=1)return i.join("");return i.slice(0,i.length-1).join(", ")+" e "+i[i.length-1];}
const SABORES={"Muçarela":{brotinho:15,grande:35,ingredientes:["molho","muçarela","azeitonas","orégano"]},"Calabresa":{brotinho:20,grande:35,ingredientes:["molho","muçarela","calabresa","cebola","azeitonas","orégano"]},"Catupiry":{brotinho:20,grande:35,ingredientes:["molho","muçarela","catupiry","azeitonas","orégano"]},"Calabresa com Catupiry":{brotinho:20,grande:40,ingredientes:["molho","muçarela","calabresa","catupiry","azeitonas","orégano"]},"Frango com Catupiry":{brotinho:20,grande:40,ingredientes:["molho","muçarela","frango desfiado","catupiry","azeitonas","orégano"]},"Presunto":{brotinho:20,grande:35,ingredientes:["molho","muçarela","presunto","cebola","azeitonas","orégano"]},"Presunto com Catupiry":{brotinho:20,grande:40,ingredientes:["molho","muçarela","presunto","catupiry","azeitonas","orégano"]},"Brasileira":{brotinho:20,grande:40,ingredientes:["molho","muçarela","milho verde","ervilha","cebola","azeitonas","orégano"]},"Frango com Milho e Tomate":{brotinho:20,grande:40,ingredientes:["molho","muçarela","frango desfiado","milho verde","tomate","azeitonas","orégano"]},"Baiana":{brotinho:23,grande:40,ingredientes:["molho","muçarela","calabresa","bacon","molho de pimenta","cebola","azeitonas","orégano"]},"Bacon":{brotinho:23,grande:40,ingredientes:["molho","muçarela","bacon","cebola","azeitonas","orégano"]},"Cremosa":{brotinho:23,grande:40,ingredientes:["molho","muçarela","catupiry","creme de leite","azeitonas","orégano"]},"Lombo ao Creme":{brotinho:23,grande:40,ingredientes:["molho","muçarela","lombinho","creme de leite","azeitonas","orégano"]}};
const ADICIONAIS=[{nome:"Catupiry Extra",valor:4},{nome:"Presunto Extra",valor:4},{nome:"Cebola Extra",valor:4},{nome:"Milho Extra",valor:4},{nome:"Ervilha Extra",valor:4},{nome:"Muçarela Extra",valor:5},{nome:"Bacon Extra",valor:5}];
function carregarSabores(){const t=document.getElementById("tamanho").value,s1=document.getElementById("sabor1"),s2=document.getElementById("sabor2"),v1=s1.value,v2=s2.value;s1.innerHTML='<option value="">Selecione um sabor</option>';s2.innerHTML='<option value="">Selecione um sabor</option>';for(const[n,d]of Object.entries(SABORES)){const p=t==="brotinho"?d.brotinho:d.grande,ings=formarListaIngredientes(d.ingredientes);const txt=`${n} - R$ ${p.toFixed(2)} (${ings})`;s1.innerHTML+=`<option value="${n}">${txt}</option>`;s2.innerHTML+=`<option value="${n}">${txt}</option>`;}s1.value=v1&&SABORES[v1]?v1:"";s2.value=v2&&SABORES[v2]?v2:"";if(t==="brotinho"){document.getElementById("tipoPizza").value="inteira";document.getElementById("tipoPizza").disabled=true;document.getElementById("boxSabor2").style.display="none";}else{document.getElementById("tipoPizza").disabled=false;document.getElementById("boxSabor2").style.display=document.getElementById("tipoPizza").value==="meio"?"block":"none";}atualizarIngredientesPreview();}
function atualizarIngredientesPreview(){const s1=document.getElementById("sabor1").value,s2=document.getElementById("sabor2").value,t=document.getElementById("tamanho").value,tp=document.getElementById("tipoPizza").value,el=document.getElementById("ingredientes");if(!s1||!SABORES[s1]){el.innerText="";return;}if(t==="grande"&&tp==="meio"&&s2&&SABORES[s2]){el.innerText=`Ingredientes — 50% ${s1}: ${formarListaIngredientes(SABORES[s1].ingredientes)} | 50% ${s2}: ${formarListaIngredientes(SABORES[s2].ingredientes)}`;}else{el.innerText=`Ingredientes: ${formarListaIngredientes(SABORES[s1].ingredientes)}`;}}
function montarListaAdicionais(){const container=document.getElementById("listaAdicionais");container.innerHTML="";ADICIONAIS.forEach(({nome,valor})=>{const opt=document.createElement("option");opt.value=valor;opt.textContent=`${nome} (+R$ ${valor.toFixed(2)})`;opt.dataset.nome=nome;container.appendChild(opt);});}
function atualizarCarrinho(){const container=document.getElementById("carrinho"),totalEl=document.querySelector(".total"),taxaEl=document.getElementById("taxaEntregaArea");if(carrinho.length===0){container.innerHTML='<div class="item-carrinho">Nenhum item adicionado.</div>';totalEl.textContent="R$ 0,00";taxaEl.textContent="";return;}container.innerHTML=carrinho.map((item,i)=>`<div class="item-carrinho"><b>${item.descricao}</b><br/>${item.ingredientes?`<span style="color: var(--muted); font-size: 0.85rem;">${item.ingredientes}</span><br/>`:""}${item.observacao?`<span style="color: var(--azul); font-size: 0.85rem;">Obs: ${item.observacao}</span><br/>`:""}<div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center;"><strong>R$ ${item.valor.toFixed(2)}</strong><button type="button" onclick="removerItem(${i})" style="background:#ce2b37;border:none;border-radius:6px;color:#fff;cursor:pointer;padding:4px 8px;">Excluir</button></div></div>`).join("");const subtotal=carrinho.reduce((a,c)=>a+c.valor,0);const cep=document.getElementById("cep").value;const bairro=document.getElementById("bairro").value;const distanciaKm=calcularDistanciaSimulada(cep,bairro);const taxa=Number(calcularTaxaEntrega(distanciaKm,bairro));const total=subtotal+taxa;totalEl.textContent=`R$ ${total.toFixed(2)}`;taxaEl.textContent=taxa===0?"🎉 Você ganhou entrega grátis!":`Taxa de entrega: R$ ${taxa.toFixed(2)}`;}
function removerItem(i){carrinho.splice(i,1);atualizarCarrinho();}
document.getElementById("btnAdicionarPizza").addEventListener("click",()=> {
  const tamanho=document.getElementById("tamanho").value;
  const tipo=document.getElementById("tipoPizza").value;
  const sabor1=document.getElementById("sabor1").value;
  const sabor2=document.getElementById("sabor2").value;
  if(!sabor1||!SABORES[sabor1]){alert("Selecione o sabor 1.");return;}
  if(tamanho==="brotinho"&&tipo!=="inteira"){alert("Brotinho só aceita pizza inteira.");return;}
  if(tipo==="meio"&&(!sabor2||!SABORES[sabor2])){alert("Selecione o sabor 2 para pizza meio a meio.");return;}
  let descricao="";
  let valor=0;
  let ingredientes="";
  if(tamanho==="brotinho"){
    descricao=`Brotinho 25cm - ${sabor1}`;
    valor=SABORES[sabor1].brotinho;
    ingredientes=SABORES[sabor1].ingredientes.join(", ");
  }else if(tipo==="meio"){
    descricao=`Grande 35cm Meio a Meio - ${sabor1} / ${sabor2}`;
    valor=Math.max(SABORES[sabor1].grande,SABORES[sabor2].grande);
    ingredientes=`50% ${sabor1}: ${SABORES[sabor1].ingredientes.join(", ")} | 50% ${sabor2}: ${SABORES[sabor2].ingredientes.join(", ")}`;
  }else{
    descricao=`Grande 35cm - ${sabor1}`;
    valor=SABORES[sabor1].grande;
    ingredientes=SABORES[sabor1].ingredientes.join(", ");
  }
  const adicionaisSelecionados=Array.from(document.getElementById("listaAdicionais").selectedOptions).map(o=>({nome:o.dataset.nome,valor:Number(o.value)}));
  const valorAdicional=adicionaisSelecionados.reduce((a,v)=>a+v.valor,0);
  const nomesAdicionais=adicionaisSelecionados.map(a=>a.nome);
  if(nomesAdicionais.length)descricao+=" + "+nomesAdicionais.join(", ");
  valor+=valorAdicional;
  carrinho.push({tipo:"pizza",descricao,ingredientes,observacao:"",valor});
  atualizarCarrinho();
  Array.from(document.getElementById("listaAdicionais").options).forEach(opt=>opt.selected=false);
  alert("Pizza adicionada ao carrinho!");
});
document.getElementById("btnAdicionarBebida").addEventListener("click",() => {
  const sel=document.getElementById("bebida");
  if(!sel.value){alert("Selecione uma bebida.");return;}
  const descricao=sel.options[sel.selectedIndex].text.split(" - ")[0];
  const valor=Number(sel.value);
  carrinho.push({tipo:"bebida",descricao,ingredientes:"",observacao:"",valor});
  atualizarCarrinho();
  alert("Bebida adicionada ao carrinho!");
  sel.value="";
});
document.getElementById("tipoPizza").addEventListener("change", () => {
  const boxSabor2=document.getElementById("boxSabor2");
  const tipo=document.getElementById("tipoPizza");
  boxSabor2.style.display=tipo.value==="meio"?"block":"none";
  if(document.getElementById("tamanho").value==="brotinho"){
    tipo.value="inteira";
    tipo.disabled=true;
    boxSabor2.style.display = "none";
  }else{
    tipo.disabled=false;
  }
});
document.getElementById("tamanho").addEventListener("change", () => {
  carregarSabores();
  const tipo=document.getElementById("tipoPizza");
  const boxSabor2=document.getElementById("boxSabor2");
  if(document.getElementById("tamanho").value==="brotinho"){
    tipo.value="inteira";
    tipo.disabled=true;
    boxSabor2.style.display="none";
  }else{
    tipo.disabled=false;
    boxSabor2.style.display=tipo.value==="meio"?"block":"none";
  }
});
document.getElementById("sabor1").addEventListener("change", atualizarIngredientesPreview);
document.getElementById("sabor2").addEventListener("change", atualizarIngredientesPreview);

document.getElementById("cep").addEventListener("input", ()=>{
  if(document.getElementById("cep").value.replace(/\D/g,'').length === 8)
    buscarPorCep();
});
document.getElementById("rua").addEventListener("input", buscarCepPelaRua);
document.getElementById("bairro").addEventListener("input", atualizarTaxaEntrega);
document.getElementById("numero").addEventListener("input", atualizarTaxaEntrega);

carregarSabores();
montarListaAdicionais();
atualizarTaxaEntrega();

document.getElementById("btnFinalizarPedido").addEventListener("click", ()=>{
  if(carrinho.length===0){
    alert("Adicione itens ao carrinho antes de finalizar.");
    return;
  }
  let nome=document.getElementById("nome").value.trim();
  let telefone=document.getElementById("telefone").value.trim();
  let cep=document.getElementById("cep").value.trim();
  let rua=document.getElementById("rua").value.trim();
  let numero=document.getElementById("numero").value.trim();
  let bairro=document.getElementById("bairro").value.trim();
  let obs=document.getElementById("observacao").value.trim();
  let distanciaKm=calcularDistanciaSimulada(cep,bairro);
  let taxaEntrega=calcularTaxaEntrega(distanciaKm,bairro);
  let texto="KING VENTURA PIZZARIA\n\nCliente: "+nome+
  "\nTelefone: "+telefone+
  "\nEndereço: "+rua+" nº "+numero+", "+bairro+
  "\nCEP: "+cep+
  "\nObservação: "+obs+
  "\n\nITENS DO PEDIDO:\n";
  carrinho.forEach((item,i)=>{
    texto+=(i+1)+". "+item.descricao+" - R$ "+item.valor.toFixed(2)+"\n";
    if(item.ingredientes)texto+="   Ingredientes: "+item.ingredientes+"\n";
    if(item.observacao)texto+="   Obs: "+item.observacao+"\n";
  });
  texto+="\nTaxa de Entrega: R$ "+taxaEntrega+"\n";
  let total=carrinho.reduce((a,v)=>a+v.valor,0)+Number(taxaEntrega);
  texto+="TOTAL: R$ "+total.toFixed(2);
  let numWhats="5567991476156";
  window.open("https://wa.me/"+numWhats+"?text="+encodeURIComponent(texto),"_blank");
});
</script>
</body>
</html>
