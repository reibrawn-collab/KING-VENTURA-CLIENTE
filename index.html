<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>King Ventura Cliente</title>
<style>
  :root {
    --bg-dark: #05080f;
    --card-dark: #0b1526;
    --card2-dark: #132241;
    --border-dark: #1e3560;
    --azul-dark: #4a90e2;
    --texto-dark: #ffffff;
    --muted-dark: #9fb4d6;
    --gold-dark: #4a90e2;
    --danger-dark: #cf4638;

    --bg-light: #f5f7fa;
    --card-light: #ffffff;
    --card2-light: #f0f3f8;
    --border-light: #cfd8e4;
    --azul-light: #2c3e50;
    --texto-light: #3b3b3b;
    --muted-light: #7f8c8d;
    --gold-light: #1b4f9c;
    --danger-light: #b8302a;
  }

  body[data-tema="escuro"] {
    --bg: var(--bg-dark);
    --card: var(--card-dark);
    --card2: var(--card2-dark);
    --border: var(--border-dark);
    --azul: var(--azul-dark);
    --texto: var(--texto-dark);
    --muted: var(--muted-dark);
    --gold: var(--gold-dark);
    --danger: var(--danger-dark);
  }

  body[data-tema="claro"] {
    --bg: var(--bg-light);
    --card: var(--card-light);
    --card2: var(--card2-light);
    --border: var(--border-light);
    --azul: var(--azul-light);
    --texto: var(--texto-light);
    --muted: var(--muted-light);
    --gold: var(--gold-light);
    --danger: var(--danger-light);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
  }
  body {
    background: var(--bg);
    color: var(--texto);
    padding: 16px;
    line-height: 1.45;
    transition: background-color 0.3s, color 0.3s;
  }
  .container {
    max-width: 900px;
    margin: auto;
  }
  .brand-header {
    text-align: center;
    margin-bottom: 20px;
  }
  .logo h1 {
    color: var(--azul);
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
  }
  .logo h1 div:last-child {
    margin-top: 6px;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .logo p {
    color: var(--muted);
    font-size: 18px;
    margin-top: 6px;
  }
  .mode-toggle-container {
    margin-top: 12px;
  }
  button.mode-toggle {
    padding: 6px 20px;
    font-weight: 600;
    font-size: 0.875rem;
    border-radius: 8px;
    background: var(--azul);
    color: white;
    border: none;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.3s ease;
  }
  button.mode-toggle:hover {
    background-color: #3671c6;
  }

  .italian-stripes {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
    margin-bottom: 18px;
  }
  .italian-stripes div {
    width: 50px;
    height: 10px;
    border-radius: 5px;
  }
  .green { background-color: #008C45; }
  .white { background-color: #F4F5F0; }
  .red { background-color: #CD212A; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
    transition: background-color 0.3s, border-color 0.3s;
  }
  .card h2 {
    color: var(--azul);
    margin-bottom: 15px;
  }
  label {
    display: block;
    margin-top: 10px;
    color: var(--muted);
  }
  input, select, textarea {
    width: 100%;
    background: var(--card2);
    color: var(--texto);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-top: 8px;
    transition: background-color 0.3s, border-color 0.3s, color 0.3s;
  }
  select {
    cursor:pointer;
    appearance:none;
    padding-right: 30px;
    background-image: url('data:image/svg+xml;charset=US-ASCII,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="white"><polygon points="0,0 14,0 7,7"/></svg>');
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:10px;
  }
  .grid {
    display: grid;
    gap: 12px;
  }
  .grid-2 {
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  }
  button {
    cursor: pointer;
    border: none;
    background: var(--azul);
    color: white;
    padding: 12px;
    border-radius: 10px;
    width: 100%;
    font-weight: bold;
    font-size: 1rem;
    margin-top: 10px;
    transition: background-color 0.3s;
    white-space: nowrap;
  }
  button:hover, button.mode-toggle:hover {
    opacity: 0.9;
  }
  #ingredientes {
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--muted);
    min-height: 40px;
    font-style: italic;
  }
  .extra-list {
    display: none;
    max-height: 140px;
    overflow-y: auto;
    margin-top: 6px;
    padding-left: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card2);
  }
  .extra-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    color: var(--texto);
  }
  .extra-item label {
    cursor: pointer;
    flex: 1;
  }
  .extra-item input {
    margin-right: 8px;
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    cursor: pointer;
  }

  #carrinho {
    margin-top: 10px;
  }
  .item-carrinho {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--card2);
    border-radius: 10px;
    margin-bottom: 8px;
    padding: 10px 16px;
    word-break: normal;
  }
  .item-carrinho > div {
    white-space: normal !important;
    overflow-wrap: break-word !important;
    flex-grow: 1;
    text-overflow: unset !important;
    overflow: visible !important;
  }
  .item-carrinho button {
    align-self: flex-start;
    background: var(--danger);
    border: none;
    border-radius: 6px;
    color: white;
    padding: 6px 14px;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .total {
    font-size: 24px;
    font-weight: bold;
    color: var(--azul);
    text-align: right;
    margin-top: 10px;
  }
  .entrega-taxa {
    color: var(--azul);
    font-weight: 700;
    margin-top: 10px;
    text-align: right;
  }
  footer {
    text-align: center;
    margin: 20px 0;
    font-weight: 700;
    font-size: 1.1rem;
    color: #CD212A;
  }
  footer a {
    color: #008C45;
    text-decoration: none;
  }
  footer a:hover {
    text-decoration: underline;
  }
  .pagamento-container {
    margin-top: 15px;
  }
  .troco-container {
    margin-top: 10px;
    display: none;
  }
  @media (max-width: 700px) {
    .logo h1 {
      font-size: 26px;
    }
  }
</style>
</head>
<body data-tema="escuro">
<div class="container">
  <div class="brand-header">
    <div class="logo">
      <h1>
        <div>KING</div>
        <div>VENTURA</div>
        <div>PIZZARIA</div>
      </h1>
      <div class="italian-stripes">
        <div class="green"></div>
        <div class="white"></div>
        <div class="red"></div>
      </div>
      <p>Monte seu pedido online</p>
      <div class="mode-toggle-container">
        <button id="btnTema" class="mode-toggle" type="button" aria-label="Alternar modo claro/escuro">
          🌙 Escuro
        </button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🍕 Escolha sua Pizza</h2>
    <div class="grid grid-2">
      <div>
        <label for="tamanho">Tamanho</label>
        <select id="tamanho" aria-describedby="ingredientes">
          <option value="brotinho">Brotinho 25cm (1 sabor)</option>
          <option value="grande">Grande 35cm</option>
        </select>
      </div>
      <div>
        <label for="tipoPizza">Tipo</label>
        <select id="tipoPizza" aria-describedby="ingredientes">
          <option value="inteira">Inteira</option>
          <option value="meio">Meio a Meio</option>
        </select>
      </div>
    </div>

    <div class="grid grid-2" style="margin-top: 15px;">
      <div>
        <label for="sabor1">Sabor 1</label>
        <select id="sabor1" aria-describedby="ingredientes"></select>
      </div>
      <div id="boxSabor2" style="display:none;">
        <label for="sabor2">Sabor 2 (Meio a Meio)</label>
        <select id="sabor2" aria-describedby="ingredientes"></select>
      </div>
    </div>

    <div id="ingredientes"></div>

    <div class="btn-toggle-adicionais" id="btnToggleAdicionais" tabindex="0">
      ➕ Adicionais <span class="adicional-count" id="adicionalCount">0</span>
    </div>
    <div class="extra-list" id="listaAdicionais" role="region" aria-label="Lista de adicionais"></div>

    <label for="obsPizza" style="margin-top: 15px;">Observação da Pizza</label>
    <input id="obsPizza" placeholder="Ex: sem cebola, assar bem" />

    <button id="btnAdicionarPizza">Adicionar Pizza ao Carrinho</button>
  </div>

  <div class="card">
    <h2>🥤 Bebidas</h2>
    <label for="bebida">Escolha sua bebida</label>
    <select id="bebida">
      <option value="">Nenhuma</option>
      <option value="16">Coca-Cola 2L - R$ 16,00</option>
      <option value="10">Guaraná 1L - R$ 10,00</option>
      <option value="6">Coca-Cola Lata 310ml - R$ 6,00</option>
    </select>
    <button id="btnAdicionarBebida" style="margin-top: 12px;">Adicionar Bebida ao Carrinho</button>
  </div>

  <div class="card">
    <h2>👤 Dados do Cliente</h2>
    <label for="nome">Nome</label>
    <input id="nome" placeholder="Nome completo" />
    <label for="telefone">Telefone</label>
    <input id="telefone" placeholder="(67) 99999-9999" />
    <label for="cep">CEP</label>
    <input id="cep" maxlength="9" placeholder="Digite seu CEP" />
    <label for="rua">Rua</label>
    <input id="rua" placeholder="Rua" />
    <label for="bairro">Bairro</label>
    <input id="bairro" placeholder="Bairro" />
    <label for="cidade">Cidade</label>
    <input id="cidade" placeholder="Cidade" />
    <label for="estado">Estado</label>
    <input id="estado" maxlength="2" placeholder="UF" style="text-transform: uppercase;" />
    <label for="numero">Número</label>
    <input id="numero" placeholder="Número" />

    <div class="pagamento-container">
      <label for="formaPagamento">Forma de pagamento</label>
      <select id="formaPagamento">
        <option value="dinheiro">Dinheiro</option>
        <option value="cartao">Cartão</option>
        <option value="pix">Pix</option>
      </select>
    </div>

    <div class="troco-container" id="trocoContainer">
      <label for="valorTroco">Valor para troco (somente se pagará em dinheiro)</label>
      <input id="valorTroco" type="number" min="0" step="0.1" placeholder="Ex: 50.00" />
    </div>

    <label for="observacao">Observação</label>
    <textarea id="observacao" placeholder="Ponto de referência, troco, etc."></textarea>
  </div>

  <div class="card">
    <h2>🛒 Carrinho</h2>
    <div id="carrinho"><div class="item-carrinho">Nenhum item adicionado.</div></div>
    <div class="entrega-taxa" id="taxaEntregaArea"></div>
    <div class="total" id="totalPedido">R$ 0,00</div>
  </div>

  <button id="btnFinalizarPedido" style="margin-top:12px;">📦 Finalizar Pedido</button>
</div>

<footer>
  Siga a gente no Instagram <a href="https://instagram.com/kingventura_pizzaria" target="_blank">@kingventura_pizzaria</a> 🚀
</footer>

<script>
  const numeroWhats = "5567991476156";

  // Mantenha os SABORES e ADICIONAIS completos como você tinha (omiti aqui para a resposta ficar menos longa)

  // Declarar aqui seus SABORES e ADICIONAIS...

  let carrinho = [];
  let taxaEntrega = 0;

  // Funções suas originais (carregarSabores, montarListaAdicionais, atualizarTextoAdicionais, etc)
  // ... place seu código original aqui ...

  // Atualizar exibição taxa e total
  function atualizarTaxaETotal() {
    const totalItens = carrinho.reduce((sum,item) => sum + item.valor, 0);
    const totalComTaxa = totalItens + taxaEntrega;
    document.getElementById("taxaEntregaArea").textContent = taxaEntrega > 0 ? `Taxa de entrega: R$ ${taxaEntrega.toFixed(2)}` : "🎉 Você ganhou entrega grátis!";
    document.getElementById("totalPedido").textContent = `R$ ${totalComTaxa.toFixed(2)}`;
  }

  // Atualizar carrinho (chamar também atualizarTaxaETotal)
  function atualizarCarrinho() {
    const container = document.getElementById("carrinho");
    if(carrinho.length === 0){
      container.innerHTML = '<div class="item-carrinho">Nenhum item adicionado.</div>';
      taxaEntrega = 0;
      atualizarTaxaETotal();
      return;
    }
    container.innerHTML = carrinho.map((item, idx) => `
      <div class="item-carrinho">
        <div>
          <b>${item.descricao}</b>
          <div style="text-align: right; color: var(--azul); font-weight: 600; margin-top: 4px;">R$ ${item.valor.toFixed(2)}</div>
          ${item.ingredientes ? `<div style="font-style: italic; color: var(--muted); font-size: 0.85rem; margin-top: 4px;">${item.ingredientes}</div>` : ""}
          ${item.observacao ? `<div style="color: var(--azul); font-size: 0.85rem; margin-top: 4px;">Obs: ${item.observacao}</div>` : ""}
        </div>
        <button type="button" onclick="removerItem(${idx})" aria-label="Remover item do carrinho">Excluir</button>
      </div>
      `).join("");
    atualizarTaxaETotal();
  }
  function removerItem(idx) {
    carrinho.splice(idx,1);
    atualizarCarrinho();
  }

  // Função cálcula distância Haversine
  function calcDistanciaKm(lat1, lon1, lat2, lon2) {
    function toRad(x) { return x * Math.PI / 180; }
    const R = 6371; // km
    const dLat = toRad(lat2-lat1);
    const dLon = toRad(lon2-lon1);
    const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
    const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R*c;
  }

  // Base endereço (Delamare 129, 79097240) lat/lon fixos
  const baseLat = -20.485113;
  const baseLon = -54.620398;

  async function obterCoordenadasEndereco() {
    const rua = document.getElementById("rua").value.trim();
    const numero = document.getElementById("numero").value.trim();
    const bairro = document.getElementById("bairro").value.trim();
    const cidade = document.getElementById("cidade").value.trim();
    const estado = document.getElementById("estado").value.trim();
    if(!rua || !bairro || !cidade || !estado) return null;
    const enderecoCompleto = encodeURIComponent(`${rua} ${numero}, ${bairro}, ${cidade}, ${estado}, Brasil`);
    try {
      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${enderecoCompleto}&limit=1`);
      const dados = await response.json();
      if(dados && dados.length > 0){
        return {lat: parseFloat(dados[0].lat), lon: parseFloat(dados[0].lon)};
      }
    }catch(e){
      console.error("Erro ao obter coordenadas:", e);
    }
    return null;
  }

  async function calcularTaxaEntrega() {
    const coordsCliente = await obterCoordenadasEndereco();
    if(!coordsCliente){
      taxaEntrega = 0;
      atualizarTaxaETotal();
      return;
    }
    const distancia = calcDistanciaKm(baseLat, baseLon, coordsCliente.lat, coordsCliente.lon);
    if(distancia <= 3){
      taxaEntrega = 0;
    } else if(distancia <= 4){
      taxaEntrega = 5;
    } else {
      taxaEntrega = 5 + Math.ceil(distancia - 4)*1;
    }
    atualizarTaxaETotal();
  }

  // Controle da visibilidade do campo troco
  const formaPagamentoEl = document.getElementById("formaPagamento");
  const trocoContainer = document.getElementById("trocoContainer");
  formaPagamentoEl.addEventListener("change", () => {
    if(formaPagamentoEl.value === "dinheiro"){
      trocoContainer.style.display = "block";
    } else {
      trocoContainer.style.display = "none";
      document.getElementById("valorTroco").value = "";
    }
  });

  // Atualizar taxa ao alterar endereço relevante
  ["rua","numero","bairro","cidade","estado"].forEach(id => {
    document.getElementById(id).addEventListener("blur", calcularTaxaEntrega);
  });

  // ... Inclua aqui a totalidade do seu código de sabores, doces, bebidas, etc.

  // Toggle tema botão
  const btnTema = document.getElementById("btnTema");
  function atualizarTextoBotaoTema() {
    const atual = document.body.getAttribute("data-tema");
    btnTema.textContent = atual === "escuro" ? "☀️ Claro" : "🌙 Escuro";
  }
  btnTema.addEventListener("click", () => {
    const atual = document.body.getAttribute("data-tema");
    const novo = atual === "escuro" ? "claro" : "escuro";
    document.body.setAttribute("data-tema", novo);
    localStorage.setItem("kv_tema", novo);
    atualizarTextoBotaoTema();
  });
  const temaSalvo = localStorage.getItem("kv_tema");
  if(temaSalvo){
    document.body.setAttribute("data-tema", temaSalvo);
  } else {
    document.body.setAttribute("data-tema", "escuro");
  }
  atualizarTextoBotaoTema();

  // Funções de adicionar pizza, bebida, finalizar pedido, carregar sabores etc continuam intactas,
  // apenas ajuste para incluir forma pagamento e troco no texto final:

  document.getElementById("btnAdicionarPizza").addEventListener("click", () => {
    // Seu código para adicionar pizza ao carrinho aqui (igual ao original, sem modificação)...
  });

  document.getElementById("btnAdicionarBebida").addEventListener("click", () => {
    // Seu código para adicionar bebida ao carrinho aqui (igual ao original)...
  });

  document.getElementById("btnFinalizarPedido").addEventListener("click", () => {
    if(carrinho.length === 0){
      alert("Adicione pelo menos um item ao carrinho antes de finalizar.");
      return;
    }
    const nome = document.getElementById("nome").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const cep = document.getElementById("cep").value.trim();
    const rua = document.getElementById("rua").value.trim();
    const numero = document.getElementById("numero").value.trim();
    const bairro = document.getElementById("bairro").value.trim();
    const cidade = document.getElementById("cidade").value.trim();
    const estado = document.getElementById("estado").value.trim();
    const formaPagamento = document.getElementById("formaPagamento").value;
    const troco = document.getElementById("valorTroco").value.trim();

    if(!nome || !telefone || !cep || !rua || !numero || !bairro || !cidade || !estado || !formaPagamento){
      alert("Preencha todos os dados do cliente corretamente.");
      return;
    }
    if(formaPagamento === "dinheiro" && troco === ""){
      alert("Informe o valor para troco.");
      return;
    }

    let texto = `KING VENTURA PIZZARIA\n\nCliente: ${nome}\nTelefone: ${telefone}\nCEP: ${cep}\nEndereço: ${rua}, Nº ${numero}\nBairro: ${bairro}\nCidade: ${cidade}\nEstado: ${estado}\nForma de pagamento: ${formaPagamento === "dinheiro" ? "Dinheiro" : formaPagamento === "pix" ? "Pix" : "Cartão"}\n`;
    if(formaPagamento === "dinheiro"){
      texto += `Troco para: R$ ${parseFloat(troco).toFixed(2)}\n`;
    }
    texto += `Observação: ${document.getElementById("observacao").value.trim()}\n\nItens do Pedido:\n`;
    carrinho.forEach(item => {
      texto += `${item.descricao} - R$ ${item.valor.toFixed(2)}\n`;
      if(item.ingredientes) texto += `Ingredientes: ${item.ingredientes}\n`;
      if(item.observacao) texto += `Obs: ${item.observacao}\n`;
      texto += "\n";
    });
    texto += `Taxa de entrega: R$ ${taxaEntrega.toFixed(2)}\n`;
    texto += `TOTAL: R$ ${(carrinho.reduce((sum,it) => sum + it.valor, 0) + taxaEntrega).toFixed(2)}\n`;

    const urlWhats = `https://wa.me/${numeroWhats}?text=` + encodeURIComponent(texto);
    window.open(urlWhats, "_blank");
  });

  // Inicialização
  montarListaAdicionais();
  carregarSabores();
  atualizarTextoAdicionais();
  atualizarCarrinho();

</script>
</body>
</html>
