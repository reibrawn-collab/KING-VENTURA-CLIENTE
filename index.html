<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>King Ventura Cliente</title>
<style>
:root{
  --bg:#05080f;
  --card:#0b1526;
  --card2:#132241;
  --border:#1e3560;
  --azul:#4a90e2;
  --texto:#ffffff;
  --muted:#9fb4d6;
}
*{
  margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif;
}
body{
  background:var(--bg);
  color:var(--texto);
  padding:15px;
}
.container{
  max-width:900px;
  margin:auto;
}
.logo{
  text-align:center;
  margin-bottom:20px;
}
.logo h1{
  color:var(--azul);
  font-size:36px;
}
.logo p{
  color:var(--muted);
  font-size:18px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
}
.card h2{
  color:var(--azul);
  margin-bottom:15px;
}
input,
select,
textarea{
  width:100%;
  background:var(--card2);
  color:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  margin-top:8px;
}
label{
  display:block;
  margin-top:10px;
  color:var(--muted);
  cursor:pointer;
}
.grid{
  display:grid;
  gap:12px;
}
.grid-2{
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
}
button{
  cursor:pointer;
  border:none;
}
.btn{
  background:var(--azul);
  color:white;
  padding:12px;
  border-radius:10px;
  width:100%;
  font-weight:bold;
}
.btn:hover{
  opacity:.9;
}
#ingredientes {
  margin-top: 12px;
  font-size: 0.9rem;
  color: var(--muted);
  min-height: 40px;
}
.custom-select-container{
  position: relative;
  user-select: none;
}
.custom-select{
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  color: var(--texto);
  cursor: pointer;
}
.custom-select:after{
  content: "▼";
  position: absolute;
  right: 15px;
  top:50%;
  transform: translateY(-50%);
  pointer-events:none;
  font-size: 0.7rem;
  color: var(--muted);
}
.custom-options {
  position: absolute;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 100%;
  max-height: 160px;
  overflow-y: auto;
  margin-top: 4px;
  z-index: 100;
  display: none;
}
.custom-options.active {
  display: block;
}
.custom-option{
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  color: var(--texto);
}
.custom-option:last-child {
  border-bottom: none;
}
.custom-option:hover, .custom-option.selected {
  background: var(--azul);
  color: white;
}
.custom-option .nome {
  font-weight: bold;
}
.custom-option .preco {
  float: right;
  color: #77a2ee;
}
.custom-option .ingredientes {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 4px;
  clear: both;
}
.extra-list select {
  width: 100%;
  min-height: 120px;
  background: var(--card2);
  color: var(--texto);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  font-size: 0.9rem;
  cursor: pointer;
}
#carrinho{
  margin-top:10px;
}
.item-carrinho{
  background:var(--card2);
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
}
.total{
  font-size:24px;
  font-weight:bold;
  color:var(--azul);
  text-align:right;
  margin-top:10px;
}
.entrega-taxa {
  color: var(--azul);
  font-weight: 700;
  margin-top: 10px;
}
.rodape{
  position:sticky;
  bottom:0;
  background:var(--card);
  padding:15px;
  border-radius:15px;
  border:1px solid var(--border);
  margin-top:20px;
  text-align:center;
  font-weight: 600;
  font-size: 0.95rem;
}
.rodape a {
  color: var(--azul);
  text-decoration: none;
}
.rodape a:hover {
  text-decoration: underline;
}
@media(max-width:700px){
.logo h1{
  font-size:26px;
}
}
</style>
</head>
<body>
<div class="container">
<div class="logo" style="text-align:center;">
<h1>👑 KING VENTURA</h1>
<div style="display:flex; justify-content:center; align-items:center; gap:6px; margin:10px auto;">
<div style="width:50px; height:6px; background:#009246; border-radius:10px;"></div>
<div style="width:50px; height:6px; background:#ffffff; border-radius:10px;"></div>
<div style="width:50px; height:6px; background:#ce2b37; border-radius:10px;"></div>
</div>
<p>Monte seu pedido online</p>
</div>

<div class="card">
  <h2>🍕 Escolha sua Pizza</h2>
  <div class="grid grid-2">
    <div>
      <label for="tamanho">Tamanho</label>
      <select id="tamanho">
        <option value="grande">Grande 35cm</option>
        <option value="brotinho">Brotinho 25cm</option>
      </select>
    </div>
    <div>
      <label for="tipoPizza">Tipo</label>
      <select id="tipoPizza">
        <option value="inteira">Inteira</option>
        <option value="meio">Meio a Meio</option>
      </select>
    </div>
  </div>
  <div style="margin-top: 12px;">
    <label for="sabor1">Sabor 1</label>
    <div class="custom-select-container" id="customSabor1"></div>
  </div>
  <div id="boxSabor2" style="display:none; margin-top: 20px;">
    <label for="sabor2">Sabor 2 (Meio a Meio)</label>
    <div class="custom-select-container" id="customSabor2"></div>
  </div>
  <div id="ingredientes"></div>
  <button id="btnAdicionarPizza" class="btn" style="margin-top:15px;">Adicionar Pizza ao Carrinho</button>
</div>

<div class="card">
  <h2>🥤 Bebidas</h2>
  <select id="bebida">
    <option value="">Nenhuma</option>
    <option value="16">Coca-Cola 2L - R$ 16,00</option>
    <option value="10">Guaraná 1L - R$ 10,00</option>
    <option value="6">Coca-Cola Lata 310ml - R$ 6,00</option>
  </select>
  <button id="btnAdicionarBebida" class="btn" style="margin-top:12px;">Adicionar Bebida ao Carrinho</button>
</div>

<div class="card">
  <h2>👤 Dados do Cliente</h2>
  <label>Nome</label>
  <input id="nome" />
  <label>Telefone</label>
  <input id="telefone" />
  <label>CEP</label>
  <input id="cep" maxlength="9" placeholder="Digite seu CEP" />
  <label>Rua</label>
  <input id="rua" placeholder="Rua" />
  <label>Número</label>
  <input id="numero" placeholder="Número" />
  <label>Bairro</label>
  <input id="bairro" placeholder="Bairro" />
  <label>Observação</label>
  <textarea id="observacao"></textarea>
</div>

<div class="card">
  <h2>➕ Adicionais</h2>
  <select multiple id="listaAdicionais" class="extra-list"></select>
</div>

<div class="card">
  <h2>🛒 Carrinho</h2>
  <div id="carrinho">
    <div class="item-carrinho">Nenhum item adicionado.</div>
  </div>
  <div class="total">R$ 0,00</div>
  <div id="taxaEntregaArea" class="entrega-taxa"></div>
</div>

<div class="rodape">
  Siga a gente no Instagram <a href="https://instagram.com/kingventurapizzaria" target="_blank" rel="noopener">@kingventurapizzaria</a>
</div>

<div class="rodape">
  <button id="btnFinalizarPedido" class="btn">📦 Finalizar Pedido</button>
</div>
</div>

<script>
const bairrosGratisAté3Km = ["jardim tarumã","copavilã","pendigo","nova laguna","laranjeiras"];
function textoLimpo(texto) {
  return texto.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function calcularTaxaEntrega(distanciaKm, bairro) {
  const bairroLimpo = textoLimpo(bairro);
  if (bairrosGratisAté3Km.includes(bairroLimpo) && distanciaKm <= 3) return 0;
  if (distanciaKm <= 3) return 0;
  let taxa = 5;
  const kmExtra = Math.max(0, distanciaKm - 3);
  taxa += kmExtra * 1.5;
  return Math.min(taxa, 20).toFixed(2);
}
function calcularDistanciaSimulada(cep, bairro) {
  const bairroLimpo = textoLimpo(bairro);
  if (bairrosGratisAté3Km.includes(bairroLimpo)) return 2.5;
  return 5;
}
function atualizarTaxaEntrega() {
  const cep = document.getElementById("cep").value;
  const bairro = document.getElementById("bairro").value;
  const taxaArea = document.getElementById("taxaEntregaArea");
  if (!cep || !bairro) {
    taxaArea.innerText = "";
    atualizarCarrinho(); // atualiza total também
    return;
  }
  const distanciaKm = calcularDistanciaSimulada(cep, bairro);
  const taxa = calcularTaxaEntrega(distanciaKm, bairro);
  taxaArea.innerText = taxa == 0 ? "🎉 Você ganhou entrega grátis!" : `Taxa de entrega: R$ ${taxa}`;
  atualizarCarrinho();
}
async function buscarPorCep() {
  const cepInput = document.getElementById("cep");
  let cep = cepInput.value.replace(/\D/g, '');
  if (cep.length !== 8) return;
  try {
    const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const dados = await resposta.json();
    if (dados.erro) return;
    document.getElementById("rua").value = dados.logradouro || "";
    document.getElementById("bairro").value = dados.bairro || "";
    atualizarTaxaEntrega();
  } catch {}
}
let timerBuscaRua;
async function buscarCepPelaRua() {
  clearTimeout(timerBuscaRua);
  timerBuscaRua = setTimeout(async () => {
    const ruaInput = document.getElementById("rua");
    const bairroInput = document.getElementById("bairro");
    const rua = ruaInput.value.trim();
    const bairro = bairroInput.value.trim();
    if (rua.length < 3) return;
    try {
      const url = `https://viacep.com.br/ws/ms/campo%20grande/${encodeURIComponent(rua)}/json/`;
      const resposta = await fetch(url);
      const lista = await resposta.json();
      if (Array.isArray(lista) && lista.length > 0) {
        let escolhido = lista[0];
        if (bairro) {
          const bairroLower = bairro.toLowerCase();
          const achado = lista.find(e=> e.bairro && e.bairro.toLowerCase() === bairroLower);
          if (achado) escolhido = achado;
        }
        if (escolhido) {
          document.getElementById("cep").value = escolhido.cep || "";
          document.getElementById("bairro").value = escolhido.bairro || bairro;
          atualizarTaxaEntrega();
        }
      }
    } catch {}
  }, 600);
}
// Dados sabores e ingredientes
const SABORES = {
  "Muçarela": { brotinho: 15, grande: 35, ingredientes: ["Molho", "Muçarela", "Azeitonas", "Orégano"] },
  "Calabresa": { brotinho: 20, grande: 35, ingredientes: ["Molho", "Muçarela", "Calabresa", "Cebola", "Azeitonas", "Orégano"] },
  "Catupiry": { brotinho: 20, grande: 35, ingredientes: ["Molho", "Muçarela", "Catupiry", "Azeitonas", "Orégano"] },
  "Calabresa com Catupiry": { brotinho: 20, grande: 40, ingredientes: ["Molho", "Muçarela", "Calabresa", "Catupiry", "Azeitonas", "Orégano"] },
  "Frango com Catupiry": { brotinho: 20, grande: 40, ingredientes: ["Molho", "Muçarela", "Frango Desfiado", "Catupiry", "Azeitonas", "Orégano"] },
  "Presunto": { brotinho: 20, grande: 35, ingredientes: ["Molho", "Muçarela", "Presunto", "Cebola", "Azeitonas", "Orégano"] },
  "Presunto com Catupiry": { brotinho: 20, grande: 40, ingredientes: ["Molho", "Muçarela", "Presunto", "Catupiry", "Azeitonas", "Orégano"] },
  "Brasileira": { brotinho: 20, grande: 40, ingredientes: ["Molho", "Muçarela", "Milho Verde", "Ervilha", "Cebola", "Azeitonas", "Orégano"] },
  "Frango com Milho e Tomate": { brotinho: 20, grande: 40, ingredientes: ["Molho", "Muçarela", "Frango Desfiado", "Milho Verde", "Tomate", "Azeitonas", "Orégano"] },
  "Baiana": { brotinho: 23, grande: 40, ingredientes: ["Molho", "Muçarela", "Calabresa", "Bacon", "Molho de Pimenta", "Cebola", "Azeitonas", "Orégano"] },
  "Bacon": { brotinho: 23, grande: 40, ingredientes: ["Molho", "Muçarela", "Bacon", "Cebola", "Azeitonas", "Orégano"] },
  "Cremosa": { brotinho: 23, grande: 40, ingredientes: ["Molho", "Muçarela", "Catupiry", "Creme de Leite", "Azeitonas", "Orégano"] },
  "Lombo ao Creme": { brotinho: 23, grande: 40, ingredientes: ["Molho", "Muçarela", "Lombinho", "Creme de Leite", "Azeitonas", "Orégano"] }
};
const ADICIONAIS = [
  { nome: "Catupiry Extra", valor: 4 },
  { nome: "Presunto Extra", valor: 4 },
  { nome: "Cebola Extra", valor: 4 },
  { nome: "Milho Extra", valor: 4 },
  { nome: "Ervilha Extra", valor: 4 },
  { nome: "Muçarela Extra", valor: 5 },
  { nome: "Bacon Extra", valor: 5 }
];
let carrinho = [];

// Função para criar o seletor customizado para sabores
function criarSelectCustom(idContainer, maisDeUm=false) {
  const container = document.getElementById(idContainer);
  container.innerHTML = '';
  const selectBox = document.createElement('div');
  selectBox.className = 'custom-select';
  selectBox.tabIndex = 0;
  selectBox.textContent = "Selecione um sabor";
  const optionsList = document.createElement('div');
  optionsList.className = 'custom-options';

  Object.entries(SABORES).forEach(([nome, dados]) => {
    const option = document.createElement('div');
    option.className = 'custom-option';
    option.dataset.valorBrotinho = dados.brotinho;
    option.dataset.valorGrande = dados.grande;
    option.dataset.nome = nome;
    option.dataset.ingredientes = dados.ingredientes.join(", ");
    option.innerHTML = `<span class="nome">${nome}</span> <span class="preco">R$ ${dados.grande.toFixed(2)}</span><br/><span class="ingredientes">${dados.ingredientes.join(", ")}</span>`;

    option.addEventListener('click', () => {
      selecionadores[idContainer] = { nome, dados };
      selectBox.textContent = `${nome} - R$ ${(document.getElementById('tamanho').value === 'brotinho' ? dados.brotinho : dados.grande).toFixed(2)}`;
      fecharDropdowns();
      atualizarIngredientesPreviewCustom();
      carregarSabores(); 
      atualizarTiposPizza();
    });
    optionsList.appendChild(option);
  });
  selectBox.addEventListener('click', () => {
    if(optionsList.classList.contains('active')) {
      fecharDropdowns();
    } else {
      fecharDropdowns();
      optionsList.classList.add('active');
    }
  });
  container.appendChild(selectBox);
  container.appendChild(optionsList);
}

// Fecha todos dropdowns
function fecharDropdowns() {
  document.querySelectorAll('.custom-options').forEach(el => el.classList.remove('active'));
}

const selecionadores = { customSabor1: null, customSabor2: null };

// Atualiza ingredientes na área dedicaca na seleção customizada
function atualizarIngredientesPreviewCustom() {
  const el = document.getElementById('ingredientes');
  const tamanho = document.getElementById('tamanho').value;
  const tipo = document.getElementById('tipoPizza').value;

  const s1 = selecionadores.customSabor1;
  const s2 = selecionadores.customSabor2;

  if(!s1) {
    el.innerText = '';
    return;
  }
  if(tamanho === 'grande' && tipo === 'meio' && s2) {
    el.innerText = `Ingredientes — 50% ${s1.nome}: ${s1.dados.ingredientes.join(', ')} | 50% ${s2.nome}: ${s2.dados.ingredientes.join(', ')}`;
  } else {
    el.innerText = `Ingredientes: ${s1.dados.ingredientes.join(', ')}`;
  }
}

// Atualiza controles quando tipo ou tamanho mudam
function atualizarTiposPizza() {
  const tamanho = document.getElementById('tamanho').value;
  const tipo = document.getElementById('tipoPizza');
  const boxSabor2 = document.getElementById('boxSabor2');
  if(tamanho === 'brotinho') {
    tipo.value = 'inteira';
    tipo.disabled = true;
    boxSabor2.style.display = 'none';
  } else {
    tipo.disabled = false;
    boxSabor2.style.display = tipo.value === 'meio' ? 'block' : 'none';
  }
}

// Adiciona pizza carrinho
document.getElementById('btnAdicionarPizza').addEventListener('click', () => {
  const tamanho = document.getElementById('tamanho').value;
  const tipo = document.getElementById('tipoPizza').value;
  if(!selecionadores.customSabor1) {
    alert('Selecione o sabor 1');
    return;
  }
  if(tamanho === 'brotinho' && tipo !== 'inteira') {
    alert('Brotinho aceita somente pizza inteira');
    return;
  }
  if(tipo === 'meio' && !selecionadores.customSabor2) {
    alert('Selecione o sabor 2 para pizza meio a meio');
    return;
  }

  let descricao = '';
  let valor = 0;
  let ingredientes = '';

  if(tamanho === 'brotinho') {
    descricao = `Brotinho 25cm - ${selecionadores.customSabor1.nome}`;
    valor = selecionadores.customSabor1.dados.brotinho;
    ingredientes = selecionadores.customSabor1.dados.ingredientes.join(', ');
  } else if(tipo === 'meio') {
    descricao = `Grande 35cm Meio a Meio - ${selecionadores.customSabor1.nome} / ${selecionadores.customSabor2.nome}`;
    valor = Math.max(selecionadores.customSabor1.dados.grande, selecionadores.customSabor2.dados.grande);
    ingredientes = `50% ${selecionadores.customSabor1.nome}: ${selecionadores.customSabor1.dados.ingredientes.join(', ')} | 50% ${selecionadores.customSabor2.nome}: ${selecionadores.customSabor2.dados.ingredientes.join(', ')}`;
  } else {
    descricao = `Grande 35cm - ${selecionadores.customSabor1.nome}`;
    valor = selecionadores.customSabor1.dados.grande;
    ingredientes = selecionadores.customSabor1.dados.ingredientes.join(', ');
  }

  const selecionadosAdicionais = Array.from(document.getElementById('listaAdicionais').selectedOptions).map(opt => ({
    nome: opt.dataset.nome,
    valor: Number(opt.value)
  }));
  const valorAdicional = selecionadosAdicionais.reduce((acc, curr) => acc + curr.valor, 0);
  const nomesAdicionais = selecionadosAdicionais.map(a => a.nome);

  if(nomesAdicionais.length > 0){
    descricao += ' + ' + nomesAdicionais.join(', ');
  }
  valor += valorAdicional;

  carrinho.push({
    tipo: 'pizza',
    descricao,
    ingredientes,
    observacao: '',
    valor
  });

  atualizarCarrinho();
  selecionadores.customSabor1 = null;
  selecionadores.customSabor2 = null;
  document.getElementById('listaAdicionais').selectedIndex = -1;
  document.getElementById('ingredientes').innerText = '';
  atualizarContadorAdicionais();
  atualizarCustomSelectPlaceholder();
  alert('Pizza adicionada ao carrinho!');
});

// Bebidas
document.getElementById('btnAdicionarBebida').addEventListener('click', () => {
  const sel = document.getElementById('bebida');
  if(!sel.value) {
    alert('Selecione uma bebida.');
    return;
  }
  const descricao = sel.options[sel.selectedIndex].text.split(' - ')[0];
  const valor = Number(sel.value);
  carrinho.push({
    tipo:'bebida',
    descricao,
    ingredientes: '',
    observacao: '',
    valor
  });
  atualizarCarrinho();
  sel.value = '';
  alert('Bebida adicionada ao carrinho!');
});

// Atualizar placeholder select custom
function atualizarCustomSelectPlaceholder(){
  document.querySelectorAll('.custom-select').forEach(cs => {
    if(!cs.textContent || cs.textContent==='') cs.textContent = 'Selecione um sabor';
  });
}
// Atualiza contador selecionados adicionais
function atualizarContadorAdicionais(){
  const selec = document.getElementById('listaAdicionais');
  const count = selec.selectedOptions.length;
  document.getElementById('contadorAdicionais').textContent = count > 0 ? count : '';
}

function atualizarCarrinho(){
  const container = document.getElementById('carrinho');
  const totalEl = document.querySelector('.total');
  if(carrinho.length===0){
    container.innerHTML = '<div class="item-carrinho">Nenhum item adicionado.</div>';
    totalEl.innerText = 'R$ 0,00';
    atualizarTaxaEntrega();
    return;
  }
  container.innerHTML = carrinho.map((item, idx)=>`
    <div class="item-carrinho">
      <b>${item.descricao}</b><br/>
      ${item.ingredientes?`<span style="color: var(--muted); font-size: 0.85rem;">${item.ingredientes}</span><br/>`:''}
      ${item.observacao?`<span style="color: var(--azul); font-size: 0.85rem;">Obs: ${item.observacao}</span><br/>`:''}
      <div style="margin-top:6px; display:flex; justify-content:space-between; align-items:center;">
        <strong>R$ ${item.valor.toFixed(2)}</strong>
        <button type="button" onclick="removerItem(${idx})" style="background:#ce2b37; border:none; border-radius:6px; color:#fff; cursor:pointer; padding:4px 8px;">Excluir</button>
      </div>
    </div>
  `).join('');
  const subtotal = carrinho.reduce((acc, i)=> acc + i.valor, 0);
  const cep = document.getElementById('cep').value;
  const bairro = document.getElementById('bairro').value;
  const distanciaKm = calcularDistanciaSimulada(cep, bairro);
  const taxa = Number(calcularTaxaEntrega(distanciaKm, bairro));
  const total = subtotal + taxa;
  totalEl.innerText = 'R$ '+total.toFixed(2);
  atualizarTaxaEntrega();
}

function removerItem(idx){
  carrinho.splice(idx, 1);
  atualizarCarrinho();
}

// Botão para fechar dropdown ao clicar fora
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.custom-select-container')){
    document.querySelectorAll('.custom-options').forEach(opt => opt.classList.remove('active'));
  }
});

document.getElementById('tamanho').addEventListener('change', () => {
  criarSelectCustom('customSabor1');
  criarSelectCustom('customSabor2');
  atualizarTiposPizza();
  atualizarIngredientesPreviewCustom();
});
document.getElementById('tipoPizza').addEventListener('change', () => {
  atualizarTiposPizza();
  atualizarIngredientesPreviewCustom();
});
document.getElementById('btnFinalizarPedido').addEventListener('click',()=>{
  if(carrinho.length===0){
    alert('Adicione itens ao carrinho antes de finalizar');
    return;
  }
  const nome = document.getElementById('nome').value.trim();
  const telefone = document.getElementById('telefone').value.trim();
  const cep = document.getElementById('cep').value.trim();
  const rua = document.getElementById('rua').value.trim();
  const numero = document.getElementById('numero').value.trim();
  const bairro = document.getElementById('bairro').value.trim();
  const observacao = document.getElementById('observacao').value.trim();
  const distanciaKm = calcularDistanciaSimulada(cep, bairro);
  const taxaEntrega = calcularTaxaEntrega(distanciaKm, bairro);
  let texto = "KING VENTURA PIZZARIA\n\nCliente: "+nome+
  "\nTelefone: "+telefone+
  "\nEndereço: "+rua+" nº "+numero+", "+bairro+
  "\nCEP: "+cep+
  "\nObservação: "+observacao+"\n\nITENS DO PEDIDO:\n";
  carrinho.forEach((item,i)=>{
    texto += (i+1)+". "+item.descricao+" - R$ "+item.valor.toFixed(2)+"\n";
    if(item.ingredientes) texto+="   Ingredientes: "+item.ingredientes+"\n";
    if(item.observacao) texto+="   Obs: "+item.observacao+"\n";
  });
  texto+="\nTaxa de Entrega: R$ "+taxaEntrega+"\n";
  const total=carrinho.reduce((a,i)=>a+i.valor,0)+Number(taxaEntrega);
  texto+="TOTAL: R$ "+total.toFixed(2);
  const numWhats = "5567991476156";
  window.open("https://wa.me/"+numWhats+"?text="+encodeURIComponent(texto),"_blank");
});

document.getElementById('cep').addEventListener('input',()=>{
  if(document.getElementById('cep').value.replace(/\D/g,'').length===8){
    buscarPorCep();
  }
});
document.getElementById('rua').addEventListener('input',buscarCepPelaRua);
document.getElementById('bairro').addEventListener('input',atualizarTaxaEntrega);
document.getElementById('numero').addEventListener('input',atualizarTaxaEntrega);
