<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>King Ventura Cliente</title>
<style>
  :root {
    --bg-dark: #05080f;
    --card-dark: #0b1526;
    --card2-dark: #132241;
    --border-dark: #1e3560;
    --azul-dark: #4a90e2;
    --texto-dark: #ffffff;
    --muted-dark: #9fb4d6;
    --gold-dark: #4a90e2;
    --danger-dark: #cf4638;

    --bg-light: #eef3fb;
    --card-light: #ffffff;
    --card2-light: #e3ecf9;
    --border-light: #b9cdea;
    --azul-light: #1b4f9c;
    --texto-light: #08203f;
    --muted-light: #4a6a94;
    --gold-light: #1b4f9c;
    --danger-light: #b8302a;
  }

  body[data-tema="escuro"] {
    --bg: var(--bg-dark);
    --card: var(--card-dark);
    --card2: var(--card2-dark);
    --border: var(--border-dark);
    --azul: var(--azul-dark);
    --texto: var(--texto-dark);
    --muted: var(--muted-dark);
    --gold: var(--gold-dark);
    --danger: var(--danger-dark);
  }

  body[data-tema="claro"] {
    --bg: var(--bg-light);
    --card: var(--card-light);
    --card2: var(--card2-light);
    --border: var(--border-light);
    --azul: var(--azul-light);
    --texto: var(--texto-light);
    --muted: var(--muted-light);
    --gold: var(--gold-light);
    --danger: var(--danger-light);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
  }
  body {
    background: var(--bg);
    color: var(--texto);
    padding: 16px;
    line-height: 1.45;
    transition: background-color 0.3s, color 0.3s;
  }
  .container {
    max-width: 900px;
    margin: auto;
  }
  .brand-header {
    text-align: center;
    margin-bottom: 20px;
  }
  .logo h1 {
    color: var(--azul);
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
  }
  .logo h1 div:last-child {
    margin-top: 6px;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .logo p {
    color: var(--muted);
    font-size: 18px;
    margin-top: 6px;
  }
  .mode-toggle-container {
    margin-top: 12px;
  }
  button.mode-toggle {
    padding: 6px 20px;
    font-weight: 600;
    font-size: 0.875rem;
    border-radius: 8px;
    background: var(--azul);
    color: white;
    border: none;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.3s ease;
  }
  button.mode-toggle:hover {
    background-color: #3671c6;
  }

  .italian-stripes {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
    margin-bottom: 18px;
  }
  .italian-stripes div {
    width: 50px;
    height: 10px;
    border-radius: 5px;
  }
  .green { background-color: #008C45; }
  .white { background-color: #F4F5F0; }
  .red { background-color: #CD212A; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
    transition: background-color 0.3s, border-color 0.3s;
  }
  .card h2 {
    color: var(--azul);
    margin-bottom: 15px;
  }
  label {
    display: block;
    margin-top: 10px;
    color: var(--muted);
  }
  input, select, textarea {
    width: 100%;
    background: var(--card2);
    color: var(--texto);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-top: 8px;
    transition: background-color 0.3s, border-color 0.3s, color 0.3s;
  }
  select {
    cursor:pointer;
    appearance:none;
    padding-right: 30px;
    background-image: url('data:image/svg+xml;charset=US-ASCII,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="white"><polygon points="0,0 14,0 7,7"/></svg>');
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:10px;
  }
  .grid {
    display: grid;
    gap: 12px;
  }
  .grid-2 {
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  }
  button {
    cursor: pointer;
    border: none;
    background: var(--azul);
    color: white;
    padding: 12px;
    border-radius: 10px;
    width: 100%;
    font-weight: bold;
    font-size: 1rem;
    margin-top: 10px;
    transition: background-color 0.3s;
    white-space: nowrap;
  }
  button:hover, button.mode-toggle:hover {
    opacity: 0.9;
  }
  #ingredientes {
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--muted);
    min-height: 40px;
    font-style: italic;
  }
  .extra-list {
    display: none;
    max-height: 140px;
    overflow-y: auto;
    margin-top: 6px;
    padding-left: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card2);
  }
  .extra-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    color: var(--texto);
  }
  .extra-item label {
    cursor: pointer;
    flex: 1;
  }
  .extra-item input {
    margin-right: 8px;
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    cursor: pointer;
  }

  #carrinho {
    margin-top: 10px;
  }
  .item-carrinho {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--card2);
    border-radius: 10px;
    margin-bottom: 8px;
    padding: 10px 16px;
    word-break: normal;
  }
  .item-carrinho > div {
    white-space: normal !important;
    overflow-wrap: break-word !important;
    flex-grow: 1;
    text-overflow: unset !important;
    overflow: visible !important;
  }
  .item-carrinho button {
    align-self: flex-start;
    background: var(--danger);
    border: none;
    border-radius: 6px;
    color: white;
    padding: 6px 14px;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .total {
    font-size: 24px;
    font-weight: bold;
    color: var(--azul);
    text-align: right;
    margin-top: 10px;
  }
  .entrega-taxa {
    color: var(--azul);
    font-weight: 700;
    margin-top: 10px;
    text-align: right;
  }
  footer {
    text-align: center;
    margin: 20px 0;
    font-weight: 700;
    font-size: 1.1rem;
    color: #CD212A;
  }
  footer a {
    color: #008C45;
    text-decoration: none;
  }
  footer a:hover {
    text-decoration: underline;
  }
  @media (max-width: 700px) {
    .logo h1 {
      font-size: 26px;
    }
  }
</style>
</head>
<body data-tema="escuro">

      <h1>
        <div>KING</div>
        <div>VENTURA</div>
        <div>PIZZARIA</div>
      </h1>
      <div class="italian-stripes">

        <div class="white"></div>

      </div>
      <p>Monte seu pedido online</p>
      <div class="mode-toggle-container">
        <button id="btnTema" class="mode-toggle" type="button" aria-label="Alternar modo claro/escuro">

  <!-- partes anteriores iguais ... -->

  <div class="card">

    <label for="rua">Rua</label>
    <input id="rua" placeholder="Rua" />
    <label for="bairro">Bairro</label>
    <input id="bairro" placeholder="Bairro" />
    <label for="cidade">Cidade</label>
    <input id="cidade" placeholder="Cidade" />
    <label for="estado">Estado</label>
    <input id="estado" maxlength="2" placeholder="UF" style="text-transform: uppercase;"/>
    <label for="numero">Número</label>
    <input id="numero" placeholder="Número" />
    <label for="observacao">Observação</label>
    <textarea id="observacao" placeholder="Ponto de referência, troco, etc."></textarea>
  </div>

  <!-- restantes continuam iguais -->

  <div class="card">
    <h2>🛒 Carrinho</h2>
    <div id="carrinho"><div class="item-carrinho">Nenhum item adicionado.</div></div>
    <div class="entrega-taxa" id="taxaEntregaArea"></div>
    <div class="total" id="totalPedido">R$ 0,00</div>
  </div>

  <button id="btnFinalizarPedido" style="margin-top:12px;">📦 Finalizar Pedido</button>
</div>

<footer>
  Siga a gente no Instagram <a href="https://instagram.com/kingventura_pizzaria" target="_blank">@kingventura_pizzaria</a> 🚀
</footer>

  cepInput.addEventListener("blur", () => {
    const cep = cepInput.value.replace(/\D/g, "");
    if (cep.length === 8) {
      fetch(`https://viacep.com.br/ws/${cep}/json/`)
        .then((response) => response.json())
        .then((data) => {
          if (!data.erro) {
            ruaInput.value = data.logradouro || "";
            bairroInput.value = data.bairro || "";
            cidadeInput.value = data.localidade || "";

            alert("CEP não encontrado.");

        })
        .catch(() => alert("Erro ao consultar o CEP."));
    }
  });

        .then((response) => response.json())
        .then((data) => {

    }
  }

  ruaInput.addEventListener("blur", buscarCepPorEndereco);
  bairroInput.addEventListener("blur", buscarCepPorEndereco);
  cidadeInput.addEventListener("blur", buscarCepPorEndereco);
  estadoInput.addEventListener("blur", () => {
    estadoInput.value = estadoInput.value.toUpperCase();
    buscarCepPorEndereco();
  });

</body>
</html>
