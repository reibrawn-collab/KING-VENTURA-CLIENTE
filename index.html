<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>King Ventura Cliente</title>
<style>
:root{
  --bg:#05080f;
  --card:#0b1526;
  --card2:#132241;
  --border:#1e3560;
  --azul:#4a90e2;
  --texto:#ffffff;
  --muted:#9fb4d6;
}
*{
  margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif;
}
body{
  background:var(--bg);
  color:var(--texto);
  padding:15px;
}
.container{
  max-width:900px;
  margin:auto;
}
.logo{
  text-align:center;
  margin-bottom:20px;
}
.logo h1{
  color:var(--azul);
  font-size:36px;
}
.logo p{
  color:var(--muted);
  font-size:18px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
}
.card h2{
  color:var(--azul);
  margin-bottom:15px;
}
input,
select,
textarea{
  width:100%;
  background:var(--card2);
  color:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  margin-top:8px;
}
label{
  display:block;
  margin-top:10px;
  color:var(--muted);
  cursor:pointer;
}
.grid{
  display:grid;
  gap:12px;
}
.grid-2{
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
}
button{
  cursor:pointer;
  border:none;
}
.btn{
  background:var(--azul);
  color:white;
  padding:12px;
  border-radius:10px;
  width:100%;
  font-weight:bold;
}
.btn:hover{
  opacity:.9;
}
#ingredientes {
  margin-top: 12px;
  font-size: 0.9rem;
  color: var(--muted);
  min-height: 40px;
}
.custom-select-container {
  position: relative;
  user-select: none;
  margin-top: 6px;
}
.custom-select {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  color: var(--texto);
  cursor: pointer;
  position: relative;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.custom-select::after {
  content: "▼";
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.7rem;
  color: var(--muted);
  pointer-events: none;
}
.custom-options {
  position: absolute;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 100%;
  max-height: 160px;
  overflow-y: auto;
  margin-top: 4px;
  z-index: 100;
  display: none;
  flex-direction: column;
}
.custom-options.active {
  display: flex;
}
.custom-option {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  color: var(--texto);
}
.custom-option:last-child {
  border-bottom: none;
}
.custom-option:hover, .custom-option.selected {
  background: var(--azul);
  color: white;
}
.custom-option .nome {
  font-weight: bold;
  display: block;
}
.custom-option .preco {
  color: #77a2ee;
  float: right;
}
.custom-option .ingredientes {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 6px;
  clear: both;
  display: block;
}
.multi-select-container {
  position: relative;
  user-select: none;
  margin-top: 6px;
}
.multi-select {
  background: var(--card2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  color: var(--texto);
  cursor: pointer;
  position: relative;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.multi-select::after {
  content: "▼";
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.7rem;
  color: var(--muted);
  pointer-events: none;
}
.multi-options {
  position: absolute;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 100%;
  max-height: 140px;
  overflow-y: auto;
  margin-top: 4px;
  z-index: 100;
  display: none;
  flex-direction: column;
}
.multi-options.active {
  display: flex;
}
.multi-option {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  color: var(--texto);
  display: flex;
  align-items: center;
  gap: 10px;
}
.multi-option:last-child {
  border-bottom: none;
}
.multi-option input[type="checkbox"]{
  cursor: pointer;
}
.multi-option:hover {
  background: var(--azul);
  color: white;
}
</style>
</head>
<body>
<div class="container">
<div class="logo" style="text-align:center;">
<h1>👑 KING VENTURA</h1>
<div style="display:flex; justify-content:center; align-items:center; gap:6px; margin:10px auto;">
<div style="width:50px; height:6px; background:#009246; border-radius:10px;"></div>
<div style="width:50px; height:6px; background:#ffffff; border-radius:10px;"></div>
<div style="width:50px; height:6px; background:#ce2b37; border-radius:10px;"></div>
</div>
<p>Monte seu pedido online</p>
</div>

<div class="card">
  <h2>🍕 Escolha sua Pizza</h2>
  <div class="grid grid-4" style="grid-template-columns: repeat(4, 1fr); gap: 12px;">
    <div>
      <label for="tamanho">Tamanho</label>
      <select id="tamanho">
        <option value="grande">Grande 35cm</option>
        <option value="brotinho">Brotinho 25cm</option>
      </select>
    </div>
    <div>
      <label for="tipoPizza">Tipo</label>
      <select id="tipoPizza">
        <option value="inteira">Inteira</option>
        <option value="meio">Meio a Meio</option>
      </select>
    </div>
    <div>
      <label>Sabor 1</label>
      <div id="customSabor1" class="custom-select-container"></div>
    </div>
    <div>
      <label>Adicionais</label>
      <div id="customAdicionais" class="multi-select-container"></div>
    </div>
  </div>
  <div id="boxSabor2" style="margin-top: 15px; display:none;">
    <label>Sabor 2 (Meio a Meio)</label>
    <div id="customSabor2" class="custom-select-container"></div>
  </div>
  <div id="ingredientes"></div>
  <button id="btnAdicionarPizza" class="btn" style="margin-top:15px;">Adicionar Pizza ao Carrinho</button>
</div>

<div class="card">
  <h2>🥤 Bebidas</h2>
  <select id="bebida">
    <option value="">Nenhuma</option>
    <option value="16">Coca-Cola 2L - R$ 16,00</option>
    <option value="10">Guaraná 1L - R$ 10,00</option>
    <option value="6">Coca-Cola Lata 310ml - R$ 6,00</option>
  </select>
  <button id="btnAdicionarBebida" class="btn" style="margin-top:12px;">Adicionar Bebida ao Carrinho</button>
</div>

<div class="card">
  <h2>👤 Dados do Cliente</h2>
  <label>Nome</label>
  <input id="nome" />
  <label>Telefone</label>
  <input id="telefone" />
  <label>CEP</label>
  <input id="cep" maxlength="9" placeholder="Digite seu CEP" />
  <label>Rua</label
